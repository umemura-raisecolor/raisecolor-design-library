\n"}, {"path": "Claude Code版/.claude/skills/homepage-pro/SKILL.md", "url": null, "text": "---\nname: homepage-pro\ndescription: お店・会社・個人事業のホームページを、AIっぽくない「プロが作ったような」見た目で作る／作り直すスキル。「ホームページを作って」「サイトを作って」「このサイトをプロっぽく直して」「AIで作ったサイトがダサい」と言われたら使う。いきなり作らず、①選択式の質問（1問ずつ）→②一番記憶に残る1か所の宣言→③写真の用意→④作る→⑤画面を撮って採点→⑥直す→⑦Netlifyで公開（フォーム）→⑧独自ドメイン（お名前.com）→⑨Search ConsoleとGA4、の順で進める。プログラミングの知識がない人向け。\n---\n\n# ホームページをプロ級にするスキル\n\nAIは、何も言われないと「世の中でいちばん多い形の平均」を出します。だから、なんとなく頼むと、どこかで見たような「AIっぽいサイト」になります。\nこのスキルは、**プロのやり方を手順として持たせる**ことで、それを防ぎます。\n\n## Claudeへの基本ルール（最初に必ず読む）\n\n- **いきなり作らない。** 下の STEP 1〜2 が終わるまで、HTMLもCSSも1行も書かない\n- **相手はプログラミングを知らない人。** 専門用語はその場で一言でかみ砕く（例：「CSS＝色や文字の大きさなど、見た目を決めるファイルです」）\n- **作業の前に「今から何をするか」、後に「何ができたか」を一言ずつ伝える。** 黙って10個まとめて作業しない\n- **事実を作らない。** 実績・お客様の声・数字・資格・創業年は、本人から聞いたことだけを書く。無いものは作らない\n- **参考サイトは、あくまで参考。** 参考にするのは雰囲気（色の数・余白・写真の使い方・落ち着き）だけ。文章・写真・ロゴ・レイアウトをそのまま写さない。できたサイトを参考サイトと並べて、一目で同じサイトだと分かるなら、真似しすぎなので直す（参考にしたサイトの持ち主に失礼で、トラブルのもとになる）\n- **作業は、今いるフォルダの中だけで行う。** ほかのファイルに触らない\n- 詳しいルールは `references/` にある。**該当するステップで必ず開いてから進める**\n\n## 全体の流れ（最初に本人に見せる）\n\n```\nホームページを作ります。この順番で進めます。\n\n1. 選択式の質問に、1問ずつ答えてもらう（全部で10問）\n2. 「このサイトで一番記憶に残る1か所」を決めて、設計図を見せる（飾りと動きは、図鑑を見て番号で選べる）\n3. 写真を用意する\n4. 作る\n5. 画面を撮って、採点係が点数をつける\n6. 点数が低いところを直して、完成\n7. インターネットに公開する（Netlify・無料）\n8. （希望する人だけ）自分だけの住所（ドメイン）を付ける\n9. Googleに知らせて、見た人の数を測れるようにする\n\n途中で止めても、フォルダに保存されているので続きから再開できます。\n```\n\n---\n\n## STEP 1｜聞き取り（選択式で、1問ずつ）\n\n**質問は1回に1問だけ。選択式で聞く。** 答えが来てから次の質問に進む。まとめて並べない（読むだけで疲れて、空欄が増えるため）。\n\n- **`AskUserQuestion` ツールで聞く。**選択肢は2〜4個＋必ず「おまかせ」。自由に書きたい人は「その他」から書ける\n- 最初に「全部で10問です。選ぶだけで進みます」と伝える。各質問の頭に「（3/10）」のように何問目かを書く\n- 答えに合わせて、次の質問の選択肢を作り直す（例：業種がリフォームなら、見る人の選択肢もリフォームのお客さんにする）\n- 「おまかせ」と言われたら、それまでの答えからいちばん良い案をAIが決めて、一言理由を添えて次へ進む\n\n| # | 聞くこと | 選択肢の作り方 |\n|---|---|---|\n| 1 | 何のお店・会社か | 業種を4つ（例：リフォーム・工務店／飲食店・カフェ／美容室・整体院／士業・教室） |\n| 2 | お店の名前 | 「自分で書く」／「おまかせ（名前の案を出す）」 |\n| 3 | 見た人にしてほしいこと（1つ） | 電話／問い合わせフォーム／予約／LINE登録 |\n| 4 | どんな人が見るか | 業種から考えたお客さん像を3つ＋おまかせ |\n| 5 | ★頼んだ人がどうなれるか（1文） | 1〜4の答えから作った案を3つ＋おまかせ |\n| 6 | 信じてもらえる材料（本当にあるものだけ） | 施工・実績の件数／資格・受賞／年数・地域での歴史／無し。「ある」を選んだら中身を書いてもらう。**無いものを作らない** |\n| 7 | ★参考にしたいサイト | URLを貼る／無し（おまかせ）。無しを選んだら「参考が無いと、どうしても平均点のサイトになりやすいです」と一度だけ伝える |\n| 8 | 写真 | 本物の写真がある／AIで作ってほしい／写真なしで作る |\n| 9 | 色 | ロゴや看板の色を指定する／雰囲気から提案（おまかせ）。提案する場合は、業種と見る人に合う色の組み合わせを3つ見せて選んでもらう |\n| 10 | 入れたくないもの | 特に無し／ある（書いてもらう） |\n\n- 参考サイトは**URLで受け取る**。**`references/参考サイトの見方.md` を開いて、書いてある順に実際に見る**（文字と並び方はWebFetchで読み、写真と色はパソコンのブラウザを画面なしで動かして一番上を撮って確かめる）。⚠️ **見えなかったことは推測で書かない。**最初に「参考サイトは、雰囲気を参考にするだけです。真似しすぎないようにします」と本人に伝えてから、見えたものを「参考にするところ／参考にしないところ」に分けて伝える。**文章・写真・ロゴ・デザインをそのまま写さない**\n- 聞き終わったら短くまとめて確認し、`サイトの設計/聞き取りメモ.md` に保存する\n\n## STEP 2｜「一番記憶に残る1か所」を宣言して、設計図を見せる\n\n**`references/design-rules.md` と `references/page-structure.md` を開いてから進める。**\n\nコードを書く前に、次の形にまとめて本人に見せ、**OKをもらってから作る。**\n\n```\nこの設計で作ります。\n\n・誰の、何のためのサイトか：\n・雰囲気（言葉3つ）：\n・一番記憶に残る1か所：（1つだけ。理由も1行）\n・色：ベース ◯◯ ／ 文字 ◯◯ ／ 差し色 ◯◯\n・文字の種類：見出し ◯◯ ／ 本文 ◯◯\n・参考サイトで参考にするところ（雰囲気だけ。真似しすぎない）：\n・ページの並び（上から）：\n  1. 一番上：（誰向け／どうなれるか／ボタン／信じられる理由）\n  2. ……（各セクションの「形」も書く。例：全幅の写真／左右2列／1行だけの余白）\n・写真を入れる場所：（◯か所）\n・あしらい：（あしらい図鑑の番号。例：1-1・3-1・6-5）\n・動き：（アニメーション図鑑の番号。例：A1・A9・C1）\n\n⚠️ 見出しやボタンの文言は、この段階で決めてしまいます。直したいところがあれば今のうちにどうぞ。\n```\n\n- 「一番記憶に残る1か所」は必ず**1つだけ**。ここに手数を集中させ、ほかは静かにする\n- 「ページの並び」は `design-rules.md` の「リズム」を満たすように組む（同じ形を続けない／余白だけの場所を1つ／写真に文字を少し重ねる場所を1つ）\n- **写真を入れられる場所には、できるだけ写真を入れる。** 写真を入れるだけで、サイトは一気に映える\n- **あしらいと動きは、図鑑を見て番号で選んでもらう。** 設計図を見せる前に、次の2つを順番に聞く。図鑑はブラウザで開く（Windowsは `start`、Macは `open` で開く）\n  1. **「あしらいの図鑑を見ますか？」**（あしらい＝見出し・区切り・写真・数字などにつける、ちょっとした飾り）。OKなら `references/図鑑_あしらい.html` を開き、「気になる番号を教えてください（例：3-1と6-5）」と伝えて、番号で選んでもらう\n     - 「控える」の札が付いた型は使わない\n     - 「おまかせ」なら、各章の「既定」の札が付いた型から、雰囲気に合うものを選ぶ\n     - あしらいは1サイト5〜6種類まで。足すより削る方が、プロの仕上がりに近づく\n  2. **「動きの図鑑を見ますか？」** OKなら `references/図鑑_動き.html` を開き、同じように番号で選んでもらう\n     - 「控える」の札が付いた型は使わない\n     - 「おまかせ」なら、既定の A1（ふわっと出る）・A9（ずらして出る）・C1（ボタンが少し浮く）・C3（下線が伸びる）・D3（スクロールでヘッダーが縮む）から選ぶ\n     - 動きは1サイト3種類まで（出現・ボタンに触れたとき・ヘッダー）。増やすほど安っぽくなる\n- 本人のOKが出たら `サイトの設計/設計図.md` に保存する\n\n## STEP 3｜写真を用意する\n\n**`references/photos.md` を開いてから進める。**\n\n- 本人の写真があれば、それを最優先で使う\n- 無ければ、Gemini API で写真を作る（`scripts/make_photos.py`）。**作る前に、`references/photos.md` の「Geminiのキーを確かめる」の順に進める**（まず `--check` で確かめる → 無ければ「持っている／持っていない／今回は使わない」を選択式で聞く → 持っていない人には取り方を1つずつ案内する → 料金と支払いの設定を必ず伝える）。キーを使わない人には、写真を作るための指示文を `サイトの設計/写真の指示文.md` に書き出し、サイトには仮の枠を置いておく\n- ⚠️ **AIで作った写真を「施工事例」「メニュー・商品」「店内」「スタッフ」「お客様」として載せない。** 実際の仕事・料理・人ではないものを、本物のように見せることになるため（料理や商品なら、実物と違うものを見せることになる）。そこは「本物の写真に差し替える場所」として仮の枠にする\n- 写真が揃ったら、**サイトを作る前に一度、写真だけを本人に見せる**（「この写真で作ってよいですか？」）\n\n## STEP 4｜作る\n\n- **HTMLとCSS（と必要最小限のJavaScript）だけで作る。** インストールや準備が要る仕組みは使わない\n- 置き場所：\n\n```\nsite/\n  index.html\n  style.css\n  script.js     ← 必要なときだけ（スマホのメニューの開閉など）\n  images/       ← 写真（WebP形式に軽くしたもの）\n  privacy.html  ← プライバシーポリシー（フォームかGA4を使うとき。templates/privacy-policy.md をもとに）\n  thanks.html   ← 問い合わせの送信完了ページ（フォームを置くとき）\n  404.html      ← 見つからないページ\n  ogp.jpg       ← SNSでシェアされたときの画像（1200×630px）\n  favicon.png   ← ブラウザのタブのアイコン\n  robots.txt\n  sitemap.xml   ← 公開するURLが決まってから正式なURLにする\nサイトの設計/    ← 聞き取りメモ・設計図・写真の指示文・採点結果（公開しない）\n```\n\n- `references/design-rules.md` のルールをすべて守る。特に「❌やらない → ✅代わりにこうする」\n- 文章は `references/page-structure.md` の「文章の書き方」に従う（決まり文句を使わない・「できること」でなく「どうなれるか」まで書く）\n- 本人があとで直しやすいように、HTMLの各セクションの前に日本語の目印を入れる（例：`<!-- ここから：施工の流れ -->`）\n- 目的が「問い合わせ」なら、フォームはNetlifyで受け取れる形で作る（`references/publish-netlify.md` の「4. 問い合わせフォーム」）。LINEなら、ボタンのリンク先に友だち追加のURLを入れる（本人に管理画面から発行したURLをもらう。手で組み立てない）\n- **SEOの設定（検索に見つけてもらうための設定）を、作る段階で必ず入れる**（`references/site-checklist.md` の「1」）。後回しにしない\n  - ページのタイトル（32文字以内）と説明文（80〜120文字）に、お店の名前・地域・何をしているかを入れる\n  - 見出しの一番大きいもの（h1）は1ページに1つ\n  - SNSでシェアされたときの表示（OGP）と `ogp.jpg`\n  - Googleにお店の情報を伝える構造化データ（お店なら `LocalBusiness`。住所・電話・営業時間は本人から聞いた本当のものだけ）\n  - `sitemap.xml` と `robots.txt`、canonical（URLが決まるまでは仮で置き、公開先が決まったら書き換える）\n  - すべての写真に、何が写っているかの説明（`alt`）\n  - 入れたら本人に「検索に見つけてもらうための設定も入れました」と一言伝える。**「検索で上位に出る」とは言わない**\n- 作り終えたら `references/site-checklist.md` を上から確認して、直せるものは直す\n\n## STEP 5｜画面を撮って、採点する\n\n**作ったら、必ず自分の目で見てから「できました」と言う。** Claudeは画面を見ずにCSSを書いているので、見た目のズレに気づけない。\n\n1. **パソコンの幅とスマホの幅で画面を撮る**（ブラウザを操作できる道具があれば使う。無ければ本人に開いてもらい、スクリーンショットを貼ってもらう）\n2. 採点係 **`homepage-critic`** に、撮った画面と `サイトの設計/設計図.md` を渡して採点してもらう（`references/critic.md` の基準で、100点満点）\n3. 結果を `サイトの設計/採点結果.md` に保存し、本人に**点数と、直すところ上位3つ**を見せる\n\n## STEP 6｜直して、完成\n\n1. 採点の「❌→✅」を上から直す\n2. もう一度撮って、採点係に見てもらう（**最大3回まで**。3回やって残ったものは、本人に正直に伝える）\n3. 本人に完成版を見せる。「なんか微妙」と言われたら、感覚で直さず `design-rules.md` の「なんか微妙を言葉にする10項目」を上から当てて、「◯番が原因でした」と伝えてから直す\n\nできたら、こう伝える。\n\n```\nできました。\nAIで作った写真を使っている場所は、本物の写真に差し替えると、さらに良くなります。\n差し替えたいときは「◯◯の写真を差し替えて」と言ってください。\n\n次は、インターネットに公開します。進めてよいですか？\n```\n\n---\n\n## STEP 7｜インターネットに公開する（Netlify）\n\n**`references/publish-netlify.md` を開き、書いてある順番どおりに、1つずつ本人に操作してもらう。**\n\n- アカウント作成 → `site` フォルダをドラッグして公開 → アドレスの名前を変える → フォームの受け付けをオンにして通知メールを設定 → テスト送信\n- ⚠️ 無料枠は公開し直すたびに減る。**直すことはまとめて、公開し直すのは1回に**\n- ⚠️ アカウント作成・ログイン・ボタン操作は本人にしてもらう。Claudeはパスワードを聞かない・預からない\n\n## STEP 8｜自分だけの住所（ドメイン）を付ける（希望する人だけ）\n\n**`references/domain-onamae.md` を開いて、書いてある順番どおりに案内する。**\n\n- まず「付ける／今は付けない」を選択式で聞く\n- 料金は、**1年目の安さでなく、2年目からの更新料金で選んでもらう**。金額は必ず申し込み画面の合計で本人に確認してもらう（料金は変わるため）\n- お名前.comで買う → Netlifyでドメインを登録 → お名前.comのネームサーバーをNetlifyのものに切り替える → 反映を待つ（最大48時間ほど）\n- つながったら、Claudeがcanonical・OGP・`sitemap.xml`・`robots.txt` のURLを新しいドメインに書き換える（**公開し直すのは STEP 9 のタグと一緒に1回**）\n\n## STEP 9｜Googleに知らせて、見た人の数を測る（Search Console・GA4）\n\n**`references/search-console-ga4.md` を開いて、書いてある順番どおりに案内する。**\n\n- Search Consoleの確認用タグ・GA4のタグ・ドメインの書き換えを**そろえてから、1回だけ公開し直す**\n- Search Console：登録 → 確認 → `sitemap.xml` を送信 → トップページのインデックス登録をリクエスト\n- GA4：測定IDをもらってタグを入れる → 目的のボタンが押された回数も測る → リアルタイムで確認 → キーイベントにする\n- プライバシーポリシーに、GA4を使っていることを書く\n\n最後にこう伝えて終わる。\n\n```\n公開おめでとうございます！\nサイトは「持っているだけ」では見られません。\nまずは、SNSのプロフィール欄とLINEのあいさつ文に、サイトのURLを貼ってください。\n1〜2週間たったら、Search Consoleで「どんな言葉で検索されたか」を一緒に見てみましょう。\n```\n"}, {"path": "Claude Code版/.claude/skills/homepage-pro/references/critic.md", "url": null, "text": "# 採点の基準（採点係が使う）\r\n\r\n> **画面を見ずに採点しない。** 必ず撮った画面を見てから点数をつけます。撮れなかったら「撮れなかった」と書き、想像で採点しません。\r\n\r\n## 見るもの\r\n\r\n- パソコンの幅：一番上・真ん中・一番下の3枚\r\n- スマホの幅（390px）：一番上・真ん中の2枚\r\n- `サイトの設計/設計図.md`（**設計図とのズレも減点**）\r\n- 参考サイトがあるときは、聞き取りのときに見た参考サイトの画面も見る。**一目で同じサイトだと分かるほど似ていたら（並べ方・見出しの言葉・写真の撮り方がそっくり）、❌として必ず挙げる**（参考サイトは雰囲気を参考にするだけ）\r\n\r\n## 点数のつけ方（100点満点）\r\n\r\n| 区分 | 配点 | 見ること |\r\n|---|---|---|\r\n| AIっぽさが無いか | 30 | `design-rules.md` の「AIっぽさの代表5つ」と禁止事項。1つ当たるごとに減点 |\r\n| 一番記憶に残る1か所 | 15 | 「このサイトで一番記憶に残るのは？」に**1つで**答えられるか。設計図で決めた場所と同じか |\r\n| 写真 | 20 | 入れられる場所に写真が入っているか／端まで使う・寄りで切るなど切り方に意図があるか／明るさと色味がそろっているか |\r\n| リズム | 10 | 同じ形の章が続いていないか／余白だけの場所があるか／写真に文字が重なる場所が1か所あるか |\r\n| 伝わるか | 15 | 一番上の4つ（誰向け・どうなれるか・ボタン・信じていい理由）が、スクロールせずに分かるか／決まり文句が無いか／ボタンの文言が具体的か |\r\n| 細部とスマホ | 10 | 見出しの改行位置／1行の長さ／文字の小ささ・横スクロール・ボタンの押しやすさ（スマホ） |\r\n\r\n## 返し方\r\n\r\n- 冒頭に**総合点と一言**（例：「72点。減点は少ないが、写真が枠に収まっていて記憶に残らない」）\r\n- 直すところは**影響の大きい順に最大7つ**。1つずつこの形で：\r\n\r\n```\r\n❌ 何が・どこで（何枚目の画面・どの章）\r\n✅ 具体的な直し方（CSSの値まで。例：padding-block: 120px／写真を width: 100vw で端まで）\r\n　 なぜ　非エンジニアに伝わる1行\r\n```\r\n\r\n- 良いところも2つ書く（残すべきものが分かるように）\r\n- **飾りを足す提案はしない**（線・アイコン・番号・英字の飾り・グラデーションは禁止側）。足すなら余白・大きさ・写真・写真の切り方\r\n- **自分でコードを直さない。** 直すのはメインのClaude\r\n- 全体で1,200字以内。読むのはプログラミングを知らない人\r\n"}, {"path": "Claude Code版/.claude/skills/homepage-pro/references/design-rules.md", "url": null, "text": "# デザインのルール（AIっぽさを消して、プロが作ったように見せる）\n\n> このスキルでサイトを作るときに、Claudeが必ず守るルールです。\n> AIは、何も指示されないと「世の中でいちばん多い形の平均」を出します。だから、**平均に戻らないように、数値と禁止事項で縛ります。**\n> **減点を消すルール（1〜3）**と、**プロっぽさを足すルール（4）**の2種類があります。両方やって初めて「プロが作った」に見えます。\n\n---\n\n## 1. 数値のルール\n\n| 項目 | ルール |\n|---|---|\n| 余白 | セクションの上下は120px以上（スマホは80px前後）。余白の値は8の倍数（8・16・24・32・48・64・96・128）でそろえる |\n| 色 | ベース・文字色・差し色1色の3色が基本。多くても4色。真っ黒（#000）と真っ白（#fff）は使わず、墨色（#1A1A1A前後）とオフホワイトにする |\n| フォント | 見出し1種＋本文1種の**2種類まで**。日本語サイトは日本語フォント（Noto Sans JP、Zen Kaku Gothic New、Shippori Mincho など）から、雰囲気で選ぶ |\n| 文字サイズ | 見出し・小見出し・本文の**3種類まで** |\n| 行間 | 本文は1.8〜2.0、見出しは1.2〜1.4 |\n| 字間 | ゴシックの見出しは-0.02em、明朝の見出しは0.02〜0.05em |\n| 1行の長さ | 本文は全角35〜40字（`max-width: 40em` 前後） |\n| 角丸 | サイト全体で統一する（0か16px。ボタンだけ999px）。8pxをあちこちに使わない |\n| 影 | ほぼ見えないくらい（rgba(0,0,0,0.06)以下）か、1pxの線で区切る |\n| 動き | ふわっと出るだけ。0.3〜0.8秒、動く距離は12〜16px。`prefers-reduced-motion` に対応する |\n| 配置 | 左寄せが基本。中央寄せは一番上の見出しなど要所だけ |\n\n---\n\n## 2. 禁止事項（❌やらない → ✅代わりにこうする）\n\n禁止だけ並べると、AIは別の変な手を打ちます。必ず「代わり」とセットで守ります。\n\n### まず、「AIっぽさ」の代表5つ（いちばん最初に消す）\n\nClaudeを作っているAnthropicが、公式ブログと公式のデザインのスキルで「ありがちだから避けるように」と名指ししているものから選んだ5つです（1・2＝公式ブログ、3〜5＝公式のデザインのスキル）。\n\n1. ❌ 紫〜藍色の色の移り変わり（グラデーション。特に白い背景の上） → ✅ ロゴや看板の色を単色で。変化をつけるなら同じ色の濃淡\n2. ❌ 何も考えずに選んだ書体（Inter・Roboto・Arial など、何も言わないと出てくる書体） → ✅ サイトの雰囲気に合わせて選んだ日本語の書体\n3. ❌ 同じ形のカード（同じ角丸・同じ影）が並ぶ → ✅ 内容ごとに並べ方を変える（写真と文章の左右交互／1つだけ大きく／表にする など）\n4. ❌ 見出しの上の小さな英字の飾り（「SERVICES」「ABOUT US」など）や、末尾の「→」 → ✅ 見出しは日本語だけで成立させる\n5. ❌ 順番に意味がない項目への番号（01／02／03） → ✅ 番号は、本当に手順や時系列になっているものにだけ付ける\n\n### そのほか\n\n- ❌ 紫から青へのグラデーション → ✅ 差し色は単色でベタ塗り。変化をつけるなら同じ色の濃淡\n- ❌ 英語の飾り見出し（ABOUT、SERVICE、WORKS、CONTACT などをセクションの上に小さく置く） → ✅ 見出しは日本語だけで成立させる。英語を使ってよいのは、名前・ロゴ・固有名詞だけ\n- ❌ 見出しの前に置く短い横線（──） → ✅ 文字の太さ・色・余白で区切る\n- ❌ 中身のない決まり文句（「革新的な」「最先端の」「〜を提供します」「お客様第一」） → ✅ 数字・固有名詞・具体的な場面で書く（`page-structure.md` の「文章の書き方」）\n- ❌ 大きい数字を3つ横に並べる飾り（「10年／500件／100%」） → ✅ 実績は、固有名詞と具体的な中身で見せる\n- ❌ 全部を中央寄せ → ✅ 左寄せを基本にして、グリッドの左端をそろえる\n- ❌ 絵文字をあちこちに置く → ✅ 区切りは余白と見出しで作る。アイコンが要るなら線の太さをそろえたSVG\n- ❌ 濃い影 → ✅ 極薄の影か、1pxの線\n- ❌ 3種類以上のフォント → ✅ 2種類まで\n- ❌ 注釈を付けないと意味が伝わらない見せ方（「※バーの長さは〜を基準にしています」など） → ✅ 注釈を書きたくなったら、その見せ方をやめる。数字はそのまま大きく見せる\n- ❌ 架空の実績・お客様の声・数字を入れる → ✅ 本人から聞いた事実だけを書く。まだ無いものは「（準備中）」と書くか、その項目を作らない\n- ❌ 「Web制作：〇〇」など、作った側のクレジットをフッターに入れる → ✅ 入れない\n- ❌ 写真を入れられる場所を、アイコンや図形で埋める → ✅ **できるだけ写真を入れる。**写真を入れるだけでサイトは一気に映える（アイコンで埋めると、どのお店か分からなくなる）\n- ❌ 全部のセクションが、白い背景に文字だけ → ✅ 画面の印象は**写真・写真つきのカード・背景の色の面**で作る。背景の色を1〜2か所変えて区切る\n- ❌ きれいでも、どの文章も説明していない画像（雰囲気づくりのためだけのイラストなど） → ✅ 「この画像は、どの文章の何を説明しているか」を1行で言える画像だけ置く\n- ❌ 並べた説明文の長さがバラバラ（1つだけ3行で、ほかは1行など） → ✅ 並ぶ項目は、文の数と文字数をそろえる\n- ❌ 新しく足す部品（送信前の確認画面・お知らせ欄など）を、角丸の枠や太い線の箱で囲う（AIが作る画面の典型） → ✅ 隣にある部品と同じ見た目にそろえる。区切りが要るなら余白か1pxの線\n- ❌ 帯や締めのセクションに、中身より多い余白を盛る → ✅ 余白は中身に合わせる。隣り合うセクションで上下の余白を二重に付けない（120px＋120pxで240pxもあく、など）\n- ❌ AIで作った写真を「施工事例」「メニュー・商品」「スタッフ」「お客様」「店内」として載せる（実在のお店の場合。料理や商品は、実物と違うものを見せることになる） → ✅ そこは本物の写真に差し替える場所として仮の枠にする。AIの写真は、雰囲気を伝える場所（一番上の背景・区切りの写真など）にだけ使う\n\n---\n\n## 3. 「なんか微妙」を言葉にする10項目\n\n完成したサイトを本人が見て「なんか微妙」と言ったら、**感覚で直さず、上から順に当てて原因を特定**します。直したら「◯番が原因でした」と一言添えます。8割は①〜③で見つかります。\n\n| # | 見るところ | 微妙に見えるとき | 直し方 |\n|---|---|---|---|\n| ① | 余白が足りているか | ぎゅっと詰まって安っぽい | セクションの上下の余白を1.5倍にする |\n| ② | 色が多すぎないか（白・グレー・黒以外で4色以上） | ごちゃごちゃする | ベース・文字色・差し色の3色に減らす |\n| ③ | 文字サイズが3種類を超えていないか | まとまりがない | 3種類に絞る |\n| ④ | 左端がそろっているか | ガタついて落ち着かない | 開始位置をそろえる |\n| ⑤ | 全部が中央寄せになっていないか | 招待状っぽい、AIっぽい | 左寄せを基本にする |\n| ⑥ | 影が濃くないか | 古く見える | 影を薄くするか線にする |\n| ⑦ | 角丸がバラバラになっていないか | 安定感がない | 同じ値にそろえる |\n| ⑧ | 写真が弱くないか（暗い・ぼやけ・雰囲気がバラバラ） | 全体が安く見える | 写真を差し替えるか、減らして文字で見せる。**CSSを直しても良くならない** |\n| ⑨ | 一番見てほしいものが、一番目立っているか | 何のサイトか伝わらない | 見てほしいもの以外を弱める |\n| ⑩ | スマホで崩れていないか | PCと別物に見える | 横スクロール・文字の小ささ・ボタンの押しやすさを直す |\n\n---\n\n## 4. プロっぽさを作る4つ（加点）\n\n1〜3を守っても「変ではないけど記憶に残らない」サイトにしかなりません。プロっぽさはこの4つで決まります。\n\n### ① 「一番記憶に残る1か所」を先に決める\n\nAIは全部を平均点で作ります。コードを書く前に「このサイトで一番記憶に残るのはここ」を1つだけ決めて、手数をそこに集中させます。ほかは静かにします。\n\n- 例：トップの大きな写真1枚／名前の見せ方／作品一覧の並べ方\n- ❌「いい感じに」「おしゃれに」で始める → ✅「一番記憶に残るのは◯◯」「参考サイトのこの部分のように」で始める\n\n### ② リズム（構成の緩急）\n\n全セクションが同じ高さ・同じ余白・「見出し＋カード3枚」の繰り返しになると、AIっぽくなります。\n\n- **同じ形のセクションを連続させない**\n- **1ページに1か所、余白だけの場所を作る**（短い一文だけのセクションなど）\n- **1か所、写真に文字を少し重ねる**\n\n作る前に「セクションの並び表」（順番・形・高さの目安）を書いて、同じ形が続いていないか確かめます。\n\n### ③ 写真の切り方\n\n- プロは大胆に切ります（端まで広げる、寄りで切る、横長にして片側に余白を作る）。AIは何でも枠に収めがちです\n- 1枚ずつ「端まで」「寄りで」と決めてから配置します\n- ページの中で写真の明るさと色味をそろえます。そろわない写真は使いません\n\n### ④ 細部の手仕事\n\n**日本語の組み方**\n- 見出しだけ、句読点やカッコの前後の空きを詰める（`font-feature-settings: \"palt\"`）。本文には付けない\n- **見出しの改行位置は手で決める**（意味の切れ目で改行する。単語の途中で折れたまま出さない）\n- 数字は等幅にする（`font-feature-settings: \"tnum\"`）\n\n**動き**\n- 出現は12〜16pxだけ動かす\n- 複数の要素は0.06秒ずつずらして出す\n- 加減速は `cubic-bezier(0.22, 1, 0.36, 1)` を基本にする\n- ホバーで変えるのは2つまで。動きの種類は3つまで（出現・ホバー・ヘッダーの変化）\n\n---\n\n## 5. 一番上（ファーストビュー）の原則\n\n- 一番見られる場所なので、手を抜かずに作り込む\n- ❌ キャッチコピー1行だけを置く（質素に見える） → ✅ **脇役を2〜3個置く**。例：コピーの上に「何のお店・会社か」を1行、コピーの下に一言の説明、最新のお知らせ\n- ❌ 文字が1文字ずつ出てくる、時間差でふわふわ出てくる → ✅ **最初からきちんと表示**し、動かすなら極めてゆっくり\n- ❌ 強すぎるズーム、マウスに追従する動き → ✅ さりげない動きだけ\n- 写真に文字を載せるときは、**一番明るい部分でも文字が読めるか**を確認する（暗い半透明の膜を重ねる）\n- スマホでは写真の見える位置がPCと変わるので、`object-position` をPCとスマホで別々に調整する\n\n---\n\n## 心得\n\n1. **引き算がプロ、足し算が素人**。迷ったら削る\n2. **余白と写真が9割**。迷ったら、写真を増やして文字を減らす\n3. **制約を与える**。数値と禁止事項で縛るほど、オリジナルになる\n"}, {"path": "Claude Code版/.claude/skills/homepage-pro/references/domain-onamae.md", "url": null, "text": "# 独自のアドレス（ドメイン）を付ける手順｜お名前.com\r\n\r\n> Claudeは、この順番で**1つずつ**本人に操作してもらいます。1つ終わるごとに「できたら『できました』と送ってください」と伝えて待ちます。\r\n> 画面の表記は変わることがあります。案内と違ったら、スクリーンショットを貼ってもらって、画面に合わせて案内し直します。\r\n> **料金は2026年9月14日にお名前.comの公式ページで確認した数字です。** 料金は変わるので、申し込む前に画面の金額を必ず本人に確認してもらいます。\r\n\r\n---\r\n\r\n## 0. 最初に本人に説明すること\r\n\r\n```\r\nドメインは、サイトの「住所」のことです。\r\n今のサイトは「〇〇.netlify.app」という住所ですが、\r\nドメインを買うと「〇〇.com」のような、自分だけの住所にできます。\r\n\r\n【ドメインを付けるとよいこと】\r\n・名刺やSNSに載せたときに、ちゃんとした印象になる\r\n・サイトを置く場所（Netlify）を将来変えても、住所は変わらない\r\n\r\n【気をつけること】\r\n・毎年、更新の費用がかかる\r\n・更新を忘れると、サイトが見られなくなり、住所をほかの人に取られることもある\r\n\r\nなくてもサイトは公開できています。付けるかどうか、選んでください。\r\n```\r\n\r\n選択式で聞きます：**付ける／今は付けない（あとで付けられる）**\r\n\r\n---\r\n\r\n## 1. ドメインの種類を選ぶ\r\n\r\n### 料金の目安（お名前.com・税込）\r\n\r\n| 種類 | 1年目（新規登録） | 2年目からの更新（1年あたり） | 向いている人 |\r\n|---|--:|--:|---|\r\n| **.com** | 0円（1人1個まで。2個目からは750円） | **1,408円** | **迷ったらこれ。** 世界でいちばん使われていて、更新も比較的安い |\r\n| .net | 0円（1人1個まで。2個目からは750円） | 1,628円 | .comで欲しい名前が取られていたとき |\r\n| .jp | 0円（1人1個まで。2個目からは1,860円） | 3,124円 | 日本で活動していることを出したい人 |\r\n| ⚠️ .site | 0円（1人1個まで。2個目からは60円） | **4,268円** | **1年目が安くても、2年目から高くなるので注意** |\r\n| ⚠️ .online | 0円（1人1個まで。2個目からは60円） | **5,040円** | 同上 |\r\n\r\n⚠️ **上の金額に加えて、「サービス維持調整費」が上乗せされます。** 為替などを理由に、お名前.comが一時的に加えているもので、**割合は数ヶ月ごとに変わります**（2026年9月時点で26.25%）。たとえば .com の更新なら、**実際にはおよそ1,800円前後**になります。**正確な金額は、申し込み画面の合計で確認してください。**\r\n\r\n⚠️ **1年目の安さだけで選ばない。** 2年目からの更新料金を必ず見る。\r\n\r\n### 名前の決め方\r\n\r\n- **短く、読みやすく**（名前・活動名・屋号をローマ字で。例：`yamada-photo.com`）\r\n- ハイフンは1つまで。数字の0とアルファベットのOなど、紛らわしい文字は避ける\r\n- 口で伝えたときに、聞き間違えられない名前にする\r\n\r\n---\r\n\r\n## 2. お名前.comでドメインを買う\r\n\r\n1. https://www.onamae.com/ を開く\r\n2. 検索窓に、欲しい名前（例：`yamada-photo`）を入れて検索する\r\n3. 使える種類の一覧が出るので、選んだ種類（例：`.com`）にチェックを入れて、申し込みに進む\r\n4. 申し込み画面で、次を確認する\r\n   - **「Whois情報公開代行」（フーイズ情報公開代行）がオンになっているか**\r\n     - ドメインの持ち主の名前や住所は、誰でも調べられる仕組みになっています。**公開代行をオンにすると、お名前.comの情報に置き換わり、自宅の住所などが出なくなります。** 必ずオンにする\r\n   - **レンタルサーバーやほかのオプションのチェックは外す**\r\n     - サイトはNetlifyに置くので、**レンタルサーバーは要りません**\r\n     - 申し込み画面には、有料のオプションがいくつも出てきます。**ドメインだけを買う**\r\n   - **合計金額**（サービス維持調整費を含む）\r\n5. 会員登録（名前・住所・メールアドレスなど）と支払い方法を入力して、申し込みを完了する\r\n6. 登録したメールアドレスに、お名前.comからメールが届く（本人確認などの案内があれば、それに従う）\r\n\r\n### 買ったあとに本人に伝えること\r\n\r\n- お名前.comからは、**更新のお知らせや、ほかのサービスの案内メールがたくさん届きます。** 「更新期限が近い」というメールは大事なので、捨てずに確認する\r\n- **自動更新にしておくか**を決める。自動更新にしておけば、更新を忘れてサイトが止まることがない\r\n\r\n---\r\n\r\n## 3. ドメインをNetlifyのサイトにつなぐ\r\n\r\n「つなぐ」とは、`yamada-photo.com` を開いたときに、Netlifyに置いたサイトが表示されるように設定することです。\r\n**Netlify側で住所を登録 → お名前.com側で「このドメインはNetlifyが管理します」と設定**、の順番で行います。\r\n\r\n### 3-1. Netlify側：ドメインを登録する\r\n\r\n1. Netlifyでそのサイトを開き、**Domain management**（ドメインの管理）を開く\r\n2. **Add a domain**（ドメインを追加。**Add custom domain** の表記の場合もある）を押す\r\n3. 買ったドメイン（例：`yamada-photo.com`）を入力して進む\r\n4. 「このドメインを持っていますか」のような確認が出たら、進む\r\n5. **Netlify DNS**（Netlifyにドメインの管理を任せる）を設定する画面に進み、案内に沿って進める\r\n6. 最後に、**ネームサーバー**（ドメインの管理を担当するところ）が4つ表示される（例：`dns1.p01.nsone.net` のような形）。**この4つをメモする**\r\n\r\n### 3-2. お名前.com側：ネームサーバーをNetlifyに切り替える\r\n\r\n1. **お名前.com Navi**（お名前.comの管理画面。https://navi.onamae.com/ ）にログインする\r\n2. メニューの **「ネームサーバー／DNS」** → **「ネームサーバー設定」** を開く\r\n3. 対象のドメインにチェックを入れる\r\n4. **「他のネームサーバーを利用」** を選び、Netlifyでメモした **4つのネームサーバー** を1つずつ入力する\r\n5. 確認して、設定を完了する\r\n\r\n⚠️ 「ネームサーバー設定」と「DNSレコード設定」は**別のメニュー**です。今回使うのは「**ネームサーバー設定**」だけです。\r\n\r\n### 3-3. 反映を待つ\r\n\r\n- 切り替えが世界中に行きわたるまで、**数時間、長いと48時間ほど**かかります。すぐに表示されなくても慌てなくて大丈夫です\r\n- 反映されると、Netlifyが自動で **HTTPS**（アドレスの頭が `https://` になり、鍵マークが付く安全な通信）の設定をしてくれます\r\n- Netlifyの **Domain management** の画面で、ドメインの横に確認済みの表示が出ていればOK\r\n\r\n### 3-4. 表示を確認する\r\n\r\n- [ ] `https://yamada-photo.com` を開いて、サイトが表示される\r\n- [ ] `https://www.yamada-photo.com` を開いても、表示される（または自動で移動する）\r\n- [ ] アドレスの横に鍵マークが出ている\r\n\r\n---\r\n\r\n## 4. つながったあとにClaudeがやること\r\n\r\n1. `index.html` などの canonical・OGPのURL、`sitemap.xml`、`robots.txt` を、**新しいドメインのURLに書き換える**\r\n2. 本人に、サイトを**公開し直して**もらう（`publish-netlify.md` の「6. サイトを更新するとき」）\r\n3. SNSのプロフィール欄のURLも、新しいアドレスに変えてもらう\r\n4. Googleの **Search Console**（サーチコンソール。Googleの検索にサイトを知らせる無料の道具）への登録を案内する\r\n\r\n---\r\n\r\n## うまくいかないとき\r\n\r\n| 症状 | 考えられること | 対応 |\r\n|---|---|---|\r\n| 2日たっても表示されない | ネームサーバーの入力ミス | お名前.com Naviの「ネームサーバー設定」で、4つが正しく入っているか見てもらう（スクリーンショットをもらって確認する） |\r\n| 「安全ではない」と表示される | HTTPSの設定がまだ | 反映直後はよくある。数時間待つ。Netlifyの Domain management で HTTPS の設定状況を見てもらう |\r\n| `www.` を付けると表示されない | wwwの設定がまだ | Netlifyの Domain management で、wwwのほうも登録されているか確認する |\r\n"}, {"path": "Claude Code版/.claude/skills/homepage-pro/references/page-structure.md", "url": null, "text": "# ページの組み立て方と、文章の書き方\r\n\r\n> 見た目がきれいでも、**見た人が「で、どうすればいいの？」と迷うサイト**は、プロの仕事になりません。\r\n> このファイルは、見た人に行動してもらう（電話・問い合わせ・予約など）ための組み立て方です。\r\n\r\n---\r\n\r\n## 1. 一番上（ファーストビュー）に置く4つ\r\n\r\n開いて最初に見える画面で、この4つが**スクロールしなくても**分かるようにします。\r\n\r\n| # | 置くもの | 例（リフォーム店） |\r\n|---|---|---|\r\n| ① | **誰のためのサイトか** | 「築30年を過ぎたお家の、水まわりのリフォーム」 |\r\n| ② | **頼むとどうなれるか** | 「毎朝の台所が、立つのが楽しみな場所に」 |\r\n| ③ | **次にやること（ボタン）** | 「無料で見積もりを頼む」 |\r\n| ④ | **信じていい理由**（本当にあるものだけ） | 「地域で施工320件」「一級建築士が在籍」 |\r\n\r\n- ④が無いお店は、無理に作らない。**写真（仕事の様子・お店の外観）で代わりに信頼を作る**\r\n- 背景に写真を置くときは、一番明るいところでも文字が読めるか確かめる\r\n\r\n## 2. 上から下への並び（基本の形）\r\n\r\nお店・会社のサイトは、見る人の頭の中の順番で並べます。\r\n\r\n1. **一番上**：上の4つ\r\n2. **困りごと**：「こんなことで困っていませんか」＝見る人が自分のことだと思える場面を3つくらい\r\n3. **できること**：困りごとに対して、何をしてくれるのか\r\n4. **選ばれる理由**：ほかのお店と違うところ（本当にあるものだけ）\r\n5. **仕事の様子・事例**：写真を大きく（本物の写真の場所）\r\n6. **流れ**：問い合わせてから終わるまで（ここは本当に手順なので、番号を付けてよい）\r\n7. **料金の目安**：載せられる範囲で。載せないなら「ご相談ください」と書く理由を一言\r\n8. **よくある質問**：頼む前に不安になることを先に答える\r\n9. **最後のボタン**：一番上と同じ行動を、もう一度\r\n\r\n- 全部入れなくてよい。**目的に要らない章は削る**（引き算がプロ）\r\n- 並びが決まったら、`design-rules.md` の「リズム」で、**同じ形の章が続いていないか**確かめる\r\n\r\n## 3. 文章の書き方\r\n\r\n### 「できること」で止めず、「どうなれるか」まで書く\r\n\r\n| 段階 | 例 |\r\n|---|---|\r\n| できること | システムキッチンの交換ができます |\r\n| だから何がいいか | 引き出しが奥まで開くので、しゃがまずに鍋が取れます |\r\n| **どうなれるか**（ここまで書く） | 毎朝の台所で、腰をかばわなくてよくなります |\r\n\r\n### 決まり文句を使わない\r\n\r\n| ❌ 決まり文句 | ✅ 代わりに |\r\n|---|---|\r\n| 革新的な／最先端の | 何が新しいのかを、そのまま書く |\r\n| 〜を提供します | 「〜します」「〜できます」 |\r\n| お客様第一／真心を込めて | 実際にやっていること（「工事の前日に、ご近所へ挨拶に回ります」） |\r\n| 高品質／安心・安全 | 数字や固有名詞（「10年保証」「◯◯メーカーの認定施工店」） |\r\n\r\n- **数字と固有名詞で書く。** ただし、本人から聞いた本当のものだけ\r\n- 1文を短く。1文に言いたいことは1つ\r\n\r\n### ボタンの文言\r\n\r\n- ❌「送信」「お問い合わせ」「詳しくはこちら」 → ✅ **押すと何が起きるか**を書く（「無料で見積もりを頼む」「空いている日を見る」）\r\n- ボタンのすぐ近くに、**押す前の不安を消す一言**を置く（「しつこい営業の電話はしません」「見積もりだけでも大丈夫です」）。本当に守れることだけ書く\r\n- 1ページで目指す行動は1つ。ボタンの種類を増やさない（選択肢が多いほど、人は迷って何も選ばない）\r\n\r\n## 4. 文言は、作る前に決める\r\n\r\n見出し・ボタン・一番上の文章は、**設計図の段階で本人に確認してから**作ります。\r\n作ったあとに文言が変わると、文字の長さが変わってレイアウトも崩れ、直しが倍になるためです。\r\n"}, {"path": "Claude Code版/.claude/skills/homepage-pro/references/photos.md", "url": null, "text": "# 写真の用意のしかた\n\n> **サイトの印象は、写真でほぼ決まります。** CSSをいくら直しても、写真が弱いと安く見えます。\n> 逆に言えば、**写真を入れるだけで、サイトは一気に映えます。** 写真を入れられる場所には、できるだけ入れます。\n\n---\n\n## 1. 使う写真の優先順位\n\n1. **本人が撮った本物の写真**（仕事の様子・お店の外観・道具・スタッフ）＝いちばん強い\n2. **AIで作った写真**（雰囲気を伝える場所だけ。下の「2」の注意を守る）\n3. **写真を使わない**（色・文字・余白で見せる）\n\n## 2. ⚠️ AIで作った写真の注意（必ず本人に伝える）\n\n- AIの写真は、**「実際の仕事」「実在の人」に見える場所には使わない**\n  - ❌ 施工事例・ビフォーアフター・メニュー（料理・飲み物）や商品の写真・スタッフ紹介・お客様の声の顔写真・「当店の店内」\n  - ✅ 一番上の背景、章と章の区切り、「こんな暮らしに」という雰囲気の写真\n- 実在のお店で使うときは、**あとで本物に差し替える場所を `サイトの設計/写真の差し替えリスト.md` に書き出しておく**\n- 人の顔は作らない（手元・後ろ姿・遠景ならよい）。本物の人と誤解されるため\n\n## 3. AIで写真を作る（Gemini API）\n\n### Geminiのキーを確かめる（写真をAIで作る前に、必ずこの順で）\n\n#### ① まず、Claudeが確かめる（本人にはまだ聞かない）\n\n```\npython .claude/skills/homepage-pro/scripts/make_photos.py --check\n```\n\nキーの中身は画面に出さずに、「あるか」と「使えるか」だけを確かめる。\n\n- 「キーは使えます」→ 本人には聞かずに「作り方」へ進む（「料金と支払いの設定」は、作る前に一度伝える）\n- 「キーが見つかりません」→ ②へ\n- 「キーが正しくないようです」→ ②の「1. 持っている」の手順2から（貼り直してもらう）\n\n#### ② 本人に聞く（選択式で1問だけ）\n\n> 写真をAIで作るには、Googleの「Gemini（ジェミニ）」のAPIキーが要ります。\n> APIキーは、Claude CodeがGoogleの写真を作るサービスを使うための「鍵」のようなものです。お持ちですか？\n> 1. 持っている\n> 2. 持っていない（取り方を知りたい）\n> 3. 今回は使わない（写真を作るための指示文だけ用意してもらって、あとで自分で作る）\n\n#### 1. 持っている → キーを `.env` に入れてもらう\n\n**キーはチャットに貼ってもらわない。**Claudeが入れ物のファイルを作り、本人が自分でキーを貼る。\n\n1. Claudeが、作業フォルダの一番上に `.env` というファイルを作る。中身は次の1行だけ（すでに `.env` があるときは、中身を読まずに、この1行を最後に足す）\n\n   ```\n   GEMINI_API_KEY=ここにキーを貼る\n   ```\n\n2. 本人に、次のとおり伝える\n   - **Windows**：エクスプローラーで作業フォルダを開く →「.env」を右クリック →「プログラムから開く」→「メモ帳」→「ここにキーを貼る」を消して、キーを貼り付ける →「Ctrl＋S」で保存して閉じる\n   - **Mac**：Finderで作業フォルダを開く →「Command＋Shift＋.（ピリオド）」で、隠れているファイルを表示する →「.env」を右クリック →「このアプリケーションで開く」→「テキストエディット」→ 同じように貼り付けて、「Command＋S」で保存して閉じる\n   - 「=」の前後に空白を入れない。1行のまま、改行しない\n3. 「保存しました」と言われたら、もう一度 `--check` で確かめる\n   - 「キーは使えます」→「作り方」へ\n   - 「キーが見つかりません」→ ファイルの名前が「.env.txt」になっていないか（メモ帳で保存すると付くことがある）、1行目が「GEMINI_API_KEY=」で始まっているかを、本人に見てもらう\n   - 「キーが正しくないようです」→ キーをコピーし直して、貼り直してもらう（途中で切れていないか、前後に空白がないか）\n\n#### 2. 持っていない → 取り方を、1つずつ案内する（キーを作るのは無料）\n\n1. ブラウザで https://aistudio.google.com/apikey を開いて、Googleアカウントでログインする\n2. 初めての人は、利用規約に同意する。同意すると、キーが自動で1つ作られる（作られていなければ「APIキーを作成」（Create API key）を押す）\n3. キーの横にあるコピーのボタンを押して、キーをコピーする\n4. 上の「1. 持っている」の手順で、`.env` に貼ってもらう\n5. 下の「料金と支払いの設定」を案内する\n\n#### 3. 今回は使わない → 「4. APIキーが無いとき」へ\n\n写真を作るための指示文だけ用意して、サイトには仮の枠を置く。\n\n#### 料金と支払いの設定（写真を作る前に、必ず本人に伝える。2026年10月時点）\n\n- キーを作るのは無料。**でも、写真を作る機能には無料枠がない。**Googleで支払いの設定をしないと、写真は作れない\n- 料金：このスキルが使う写真のモデル（gemini-2.5-flash-image）は、1枚0.039ドル。1ドル150円なら約6円。6枚なら約35円（作り直した分も、1枚ずつかかる）\n- 支払いの設定：AI Studioの「Set up billing」（お支払いの設定）を押す → 国を選んで、規約に同意する → 連絡先と支払い方法（クレジットカードなど）を入れる → 前払い（最低5ドル）か後払いを選ぶ\n- 使いすぎが心配なら：AI Studioの利用額（Spend）のページで、月の上限（Monthly spend cap）を決めておける\n- ⚠️ 料金と画面は変わることがある。「最新の料金は、公式のページ（https://ai.google.dev/gemini-api/docs/pricing ）で確かめてください」と必ず添える\n- 支払いの設定をしたくない人には、「3. 今回は使わない」をすすめる\n\n#### ⚠️ キーの扱いで、必ず守ること\n\n- **キーをチャットに貼ってもらわない。**もし貼られたら、「キーは人に見せないものです。チャットの記録に残ったので、AI Studioでそのキーを消して、新しく作り直してください」と伝える\n- **Claudeは `.env` を開かない。中身を画面に出さない。**確かめるのは `--check` だけ\n- `.env` は公開しない。公開するのは `site/` フォルダだけなので、作業フォルダの一番上に置けば公開されない。GitHubなどに上げる人には、`.gitignore` に `.env` を書く\n\n### 作り方\n\n1. 設計図の「写真を入れる場所」ごとに、指示文（英語）を書いて `サイトの設計/写真の指示文.md` に保存する\n2. 本人に「この◯枚を作ります。1枚およそ6円で、全部で約◯円です。よいですか？」と確認する（料金は上の「料金と支払いの設定」）\n3. `scripts/make_photos.py` を実行する：\n\n```\npython .claude/skills/homepage-pro/scripts/make_photos.py サイトの設計/写真の指示文.md site/images\n```\n\n4. できた写真を本人に見せる。気に入らない1枚だけ「◯枚目をこう直して」で作り直す\n5. 失敗したときは、表示された案内に従う（「支払いの設定が必要です」と出たら「料金と支払いの設定」へ。「キーが正しくないようです」と出たら、キーを貼り直してもらう）\n\n### 指示文の書き方（プロっぽく見せるコツ）\n\n- **全部の写真で、同じ光と色味を指定する**（例：`soft natural morning light, warm neutral tones`）。写真の雰囲気がバラバラだと、それだけで素人っぽく見える\n- **何を撮った写真かを具体的に**（❌ `a beautiful kitchen` → ✅ `a renovated Japanese kitchen with light oak cabinets, morning sun through a small window, a kettle on the stove`）\n- **文字を載せる写真は、文字を置く側を空けておく**（`empty space on the left for headline text`）\n- **必ず入れる一文**：`No text, no letters, no logos, no watermarks.`（AIは変な文字を入れがち）\n- 人を入れるなら `hands only` / `seen from behind` / `far away` にする\n- 形を指定する：一番上は横長（16:9）、事例やカードは 4:3 か 1:1\n\n### 指示文ファイルの形（`make_photos.py` が読む形）\n\n```\n## hero.webp | 16:9\nA renovated Japanese kitchen ... No text, no letters, no logos, no watermarks.\n\n## section-bath.webp | 4:3\nA bright bathroom ... No text, no letters, no logos, no watermarks.\n```\n\n`## ファイル名 | 形` の次の行から、次の `##` までが指示文です。\n\n## 4. APIキーが無いとき\n\n- `サイトの設計/写真の指示文.md` だけ作り、本人に「この指示文を Gemini や ChatGPT に貼ると、写真が作れます。できたら `site/images` に、書いてあるファイル名で保存してください」と伝える\n- サイトには**仮の枠**（薄いグレーの四角に「ここに◯◯の写真」と書いたもの）を置いて、レイアウトだけ先に完成させる\n\n## 5. 本人の写真を使うとき\n\n- `素材_元の写真/` に入れてもらう\n- 明るさ・色味がそろった写真を選ぶ。**暗い・ぼやけている写真は、使わない方が良い**と正直に伝える\n- 大きすぎる写真は表示が遅くなるので、横幅を小さくしてWebP形式にする（一番上の写真＝横1600px、そのほか＝横1000pxくらい）。Pythonが使えれば Pillow で変換する\n- 1枚ずつ「端まで広げる」「寄りで切る」「枠に収める」を決めてから置く（`design-rules.md` の「写真の切り方」）\n"}, {"path": "Claude Code版/.claude/skills/homepage-pro/references/publish-netlify.md", "url": null, "text": "# Netlify（ネットリファイ）で公開する手順\r\n\r\n> Claudeは、この順番で**1つずつ**本人に操作してもらいます。\r\n> 1つ終わるごとに「できたら『できました』と送ってください」と伝えて待ちます。\r\n> **Netlifyの画面は英語です。** ボタンの名前は英語のまま書き、日本語で意味を添えます。\r\n> 画面の表記は変わることがあります。案内と違ったら、**スクリーンショットを貼ってもらって**、画面に合わせて案内し直します。\r\n> （2026年9月時点の情報です）\r\n\r\n---\r\n\r\n## 0. 最初に本人に説明すること\r\n\r\n```\r\nこれから、作ったサイトをインターネットに公開します。\r\n使うのは「Netlify（ネットリファイ）」という、サイトを置いておける無料のサービスです。\r\n\r\n公開すると、「〇〇.netlify.app」というアドレスで、誰でも見られるようになります。\r\n（独自のアドレスは、あとから付けられます）\r\n\r\n1つだけ、先に知っておいてほしいことがあります。\r\n```\r\n\r\n### ⚠️ 無料枠の仕組み（必ず伝える）\r\n\r\n- Netlifyの無料プランは、**毎月300「クレジット」**（使える量のポイント）が付きます\r\n- **サイトを公開し直すたびに15クレジット**使います。見に来た人の通信量でも減ります\r\n- **使い切ると、翌月までサイト全体が表示されなくなり、問い合わせフォームも止まります**\r\n- だから、**文章や写真の修正は、まとめて直してから1回で公開し直す**のがおすすめです。1文字直すたびに公開し直すと、すぐに減ります\r\n- 問い合わせフォームの送信は、クレジットを使いません\r\n\r\n---\r\n\r\n## 1. Netlifyのアカウントを作る\r\n\r\n本人に案内します。\r\n\r\n1. https://app.netlify.com/signup を開く\r\n2. 登録方法を選ぶ（**GitHub・GitLab・Bitbucket・Google・メールアドレス**などから選べる。よく分からなければ、Googleアカウントかメールアドレスでよい）\r\n3. 画面の案内に沿って進める。途中で使い方などを聞かれたら、当てはまるものを選べばよい\r\n4. 料金プランを聞かれたら、**Free（無料）**を選ぶ\r\n\r\n⚠️ パスワードやログイン情報は、Claudeに教えなくてかまいません。\r\n\r\n---\r\n\r\n## 2. サイトを公開する（フォルダをドラッグするだけ）\r\n\r\n⚠️ **必ずログインした状態で行う。** ログインせずに上げると、サイトに仮のパスワードがかかって、ほかの人が見られない状態になります。\r\n\r\n1. ログインした状態で、https://app.netlify.com/drop を開く\r\n2. パソコンの `site` フォルダを、**フォルダごと**画面の枠の中にドラッグ＆ドロップする\r\n   - 中身のファイルではなく、`site` フォルダそのものをドラッグする\r\n   - ⚠️ `サイトの設計` フォルダと `素材_元の写真` フォルダは入れない（公開しないもの）\r\n3. 数秒〜数十秒待つと、公開される\r\n4. 表示された **`〇〇.netlify.app`** のアドレスを開いて、サイトが見られるか確認する\r\n\r\nClaudeは、公開できたら本人に「スマホでもそのアドレスを開いて、見え方を確認してください」と伝えます。\r\n\r\n---\r\n\r\n## 3. サイトのアドレスを分かりやすい名前にする\r\n\r\n最初は、ランダムな英単語のアドレス（例：`jolly-cat-12345.netlify.app`）になっています。\r\n\r\n1. Netlifyでそのサイトを開く\r\n2. **Project configuration**（プロジェクトの設定。表記が **Site configuration** の場合もある）を開く\r\n3. **General**（全般）の中にある **Change project name**（名前を変える。**Change site name** の場合もある）を押す\r\n4. 半角英数字とハイフンで名前を入れる（例：`yamada-photo`）→ **Save**（保存）\r\n5. アドレスが `yamada-photo.netlify.app` のようになる\r\n\r\n**名前が決まったら、Claudeがやること**\r\n- `index.html` などの canonical・OGPのURL、`sitemap.xml`、`robots.txt` のサイトマップのURLを、決まったアドレスに書き換える\r\n- 書き換えたら、下の「6. サイトを更新するとき」の方法で公開し直してもらう（**独自ドメインを付ける予定なら、ドメインを付けてからまとめて書き換える**と、公開し直す回数が1回で済む）\r\n\r\n---\r\n\r\n## 4. 問い合わせフォームを使えるようにする\r\n\r\n### Claudeがフォームを作るときの形\r\n\r\n```html\r\n<form name=\"contact\" method=\"POST\" action=\"/thanks.html\" data-netlify=\"true\" netlify-honeypot=\"bot-field\">\r\n  <p hidden>\r\n    <label>この欄は入力しないでください <input name=\"bot-field\"><\/label>\r\n  <\/p>\r\n  <p>\r\n    <label for=\"name\">お名前（必須）<\/label>\r\n    <input id=\"name\" type=\"text\" name=\"name\" required autocomplete=\"name\">\r\n  <\/p>\r\n  <p>\r\n    <label for=\"email\">メールアドレス（必須）<\/label>\r\n    <input id=\"email\" type=\"email\" name=\"email\" required autocomplete=\"email\">\r\n  <\/p>\r\n  <p>\r\n    <label for=\"message\">ご相談の内容（必須）<\/label>\r\n    <textarea id=\"message\" name=\"message\" rows=\"6\" required><\/textarea>\r\n  <\/p>\r\n  <p><a href=\"/privacy.html\">プライバシーポリシー<\/a>をご確認のうえ、送信してください。<\/p>\r\n  <button type=\"submit\">この内容で相談する<\/button>\r\n<\/form>\r\n```\r\n\r\n- `data-netlify=\"true\"`＝Netlifyにフォームを受け取ってもらう印\r\n- `netlify-honeypot=\"bot-field\"`＝**ロボットのいたずら送信を見分ける仕掛け**。人には見えない欄を置き、そこに入力があったらロボットとして捨てる\r\n- Netlifyには、**迷惑な送信を自動で振り分ける機能**（Akismet）が最初から入っている\r\n- それでもいたずら送信が続くときは、フォームの中に `<div data-netlify-recaptcha=\"true\"><\/div>` を足すと、「私はロボットではありません」の確認を付けられる（見た目が変わるので、困ってから足す）\r\n- `action=\"/thanks.html\"`＝送信したあとに表示するページ\r\n\r\n### 本人に操作してもらうこと\r\n\r\n1. Netlifyでそのサイトを開き、左のメニューの **Forms**（フォーム）を開く\r\n2. **Enable form detection**（フォームを見つけて受け付ける）を押す\r\n   - ⚠️ **最初はオフになっています。** オンにしないと、送信しても届きません\r\n3. **もう一度サイトを公開し直す**（下の「6. サイトを更新するとき」の方法）\r\n   - オンにしたあとの公開から、フォームが受け付けられるようになります\r\n4. 公開したサイトのフォームから、**自分で1回テスト送信する**\r\n5. Netlifyの **Forms** の画面に、送った内容が表示されるか確認する\r\n\r\n### 送信があったらメールで知らせてもらう\r\n\r\n1. Netlifyでそのサイトを開き、**Project configuration**（または **Site configuration**）→ **Notifications**（通知）を開く\r\n2. **Form submission notifications**（フォームが送られたときの通知）の **Add notification**（通知を追加）を押す\r\n3. **Email notification**（メールで通知）を選び、受け取りたいメールアドレスを入れて保存する\r\n4. もう一度テスト送信して、**メールが届くか**確認する（届かなければ迷惑メールフォルダも見てもらう）\r\n\r\n---\r\n\r\n## 5. 公開後にClaudeが本人と確認すること\r\n\r\n- [ ] パソコンとスマホの両方で、全部のページが見られる\r\n- [ ] フォームから送ると、`thanks.html` が表示され、通知メールが届く\r\n- [ ] SNSにURLを貼ったときに、タイトルと画像が出る（出ないときは `ogp.jpg` とOGPの設定を見直す）\r\n\r\n---\r\n\r\n## 6. サイトを更新するとき\r\n\r\n1. Claudeと一緒に、`site` の中身を直す（**直したいことは、まとめて直してから**）\r\n2. Netlifyでそのサイトを開き、**Deploys**（公開の履歴）の画面を開く\r\n3. 画面の中にあるドラッグ＆ドロップの枠に、**直した `site` フォルダごと**ドラッグする\r\n4. 数十秒待って、サイトを開いて確認する\r\n\r\n⚠️ 公開し直すたびに15クレジット使います（冒頭の「無料枠の仕組み」）。\r\n\r\n---\r\n\r\n## 7. もしサイトが表示されなくなったら\r\n\r\n- 「Site not available」のような表示が出ている → **その月の無料枠を使い切った**可能性が高い。翌月になれば戻る。すぐ戻したい場合は有料プランへの変更が必要になる\r\n- 使った量は、Netlifyのチーム（アカウント）の画面にある料金・使用量のページで確認できる\r\n- 今月の残りが少ないときは、公開し直す回数を減らす\r\n\r\n---\r\n\r\n## 8. 独自のアドレス（ドメイン）を付けたい場合\r\n\r\n`domain-onamae.md` に進みます。\r\n"}, {"path": "Claude Code版/.claude/skills/homepage-pro/references/search-console-ga4.md", "url": null, "text": "# Googleに知らせる（Search Console）と、見た人の数を測る（GA4）\r\n\r\n> Claudeは、この順番で**1つずつ**本人に操作してもらいます。1つ終わるごとに「できたら『できました』と送ってください」と伝えて待ちます。\r\n> 画面の表記は変わることがあります。案内と違ったら、**スクリーンショットを貼ってもらって**、画面に合わせて案内し直します。\r\n> （2026年9月時点の情報です）\r\n> **ドメインを付けたあと（またはNetlifyのアドレスで行くと決めたあと）に行います。** 住所が変わると、登録をやり直すことになるためです。\r\n\r\n---\r\n\r\n## 0. 最初に本人に説明すること\r\n\r\n```\r\nサイトは、公開しただけではGoogleの検索にすぐには出てきません。\r\nそこで、2つの無料の道具を設定します。\r\n\r\n1. Search Console（サーチコンソール）\r\n   ＝Googleに「このサイトがあります」と知らせる道具。検索で何回表示されたかも分かります\r\n2. Googleアナリティクス（GA4）\r\n   ＝サイトに何人来たか、どのボタンが押されたかを測る道具\r\n\r\nどちらもGoogleアカウントがあれば使えます。\r\n```\r\n\r\n## 1. 公開し直す回数を1回にまとめる（Netlifyの無料枠を守るため）\r\n\r\nNetlifyは公開し直すたびに無料枠を使います（`publish-netlify.md`）。だから、**次の3つを全部そろえてから、1回だけ公開し直します。**\r\n\r\n1. ドメインを付けたあとのURLの書き換え（`domain-onamae.md` の「4」）\r\n2. Search Consoleの確認用のタグ（下の「2」）\r\n3. GA4の測定用のタグ（下の「3」）\r\n\r\n---\r\n\r\n## 2. Search Console（サーチコンソール）\r\n\r\n### 2-1. サイトを登録する\r\n\r\n1. https://search.google.com/search-console を開き、Googleアカウントでログインする\r\n2. 「プロパティを追加」を押す（初めての人は、最初からこの画面が出る）\r\n3. 2つの入れ方が出るので、**右側の「URLプレフィックス」**に、サイトのアドレスを `https://` から入れる（例：`https://yamada-reform.com/`）→「続行」\r\n   - 左側の「ドメイン」でもよいが、DNSの設定が要るので、ここでは右側を使う\r\n4. 確認方法の一覧から **「HTMLタグ」** を開き、表示された1行（`<meta name=\"google-site-verification\" content=\"……\">`）を**コピーしてClaudeに貼ってもらう**\r\n   - ⚠️ このときは、まだ「確認」を押さない。画面は開いたままにしておいてもらう\r\n\r\n### 2-2. Claudeがやること\r\n\r\n- もらった1行を、`index.html` の `<head>` の中に入れる\r\n- ここで GA4 のタグ（下の「3」）も一緒に入れてから、本人に公開し直してもらう\r\n\r\n### 2-3. 確認して、サイトマップを送る\r\n\r\n1. 公開し直したら、Search Consoleの画面に戻って **「確認」** を押す →「所有権を確認しました」と出ればOK\r\n2. 左のメニューの **「サイトマップ」** を開き、「新しいサイトマップの追加」に `sitemap.xml` と入れて **「送信」**\r\n   - 状態が「成功しました」になればOK。「取得できませんでした」は、しばらく待つと直ることが多い\r\n3. 画面上の検索窓（URL検査）に、トップページのアドレスを入れて Enter →「**インデックス登録をリクエスト**」を押す\r\n   - 「インデックス登録」＝Googleの検索の名簿に載せてもらうこと\r\n   - ⚠️ 押してもすぐに検索に出るわけではありません。**数日〜数週間かかる**ことがあります。何度も押しても早くはなりません\r\n\r\n### 2-4. 本人に伝えること\r\n\r\n- 1〜2週間後に、Search Consoleの「検索パフォーマンス」を見ると、**どんな言葉で検索されて、何回表示されたか**が分かる\r\n- お店の名前で検索して出てこないときは、まず1〜2週間待つ。それでも出なければ、Claudeに相談する\r\n\r\n---\r\n\r\n## 3. Googleアナリティクス（GA4）\r\n\r\n### 3-1. アカウントを作る\r\n\r\n1. https://analytics.google.com/ を開き、Googleアカウントでログインする\r\n2. 「測定を開始」を押す\r\n3. 順番に入力する\r\n   - **アカウント名**：お店・会社の名前\r\n   - **プロパティ名**：サイトの名前（例：「リフォームTOKYO ホームページ」）\r\n   - **レポートのタイムゾーン**：日本／**通貨**：日本円\r\n   - ビジネスの情報・目的：当てはまるものを選ぶ（迷ったら「見込み客の発掘」など）\r\n4. データの収集で **「ウェブ」** を選ぶ\r\n5. サイトのアドレス（`https://` のあと）と、ストリーム名（例：「ホームページ」）を入れて「作成」\r\n6. 表示された **測定ID（`G-` で始まる英数字）** をコピーして、Claudeに貼ってもらう\r\n\r\n### 3-2. Claudeがやること\r\n\r\n1. 全部のページの `<head>` の中に、GA4のタグを入れる（`G-XXXXXXXXXX` を、もらった測定IDに置き換える）：\r\n\r\n```html\r\n<!-- Google tag (gtag.js) -->\r\n<script async src=\"https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX\"><\/script>\r\n<script>\r\n  window.dataLayer = window.dataLayer || [];\r\n  function gtag(){dataLayer.push(arguments);}\r\n  gtag('js', new Date());\r\n  gtag('config', 'G-XXXXXXXXXX');\r\n<\/script>\r\n```\r\n\r\n2. **サイトの目的のボタンが押された回数を測る**（「見た人に一番してほしいこと」のボタン）。ボタンに次のような印を付ける：\r\n\r\n```html\r\n<a class=\"btn btn-line\" href=\"（LINEの友だち追加のURL）\" onclick=\"gtag('event', 'line_click')\">LINEで写真を送って相談する<\/a>\r\n```\r\n\r\n   - 問い合わせフォームなら、`thanks.html` が表示された回数で測れるので、印は要らない\r\n3. **プライバシーポリシーに「Googleアナリティクスを使っています」を書く**（`templates/privacy-policy.md` の「4. アクセス解析について」を残す）。GA4を使うときは、これを書くことがGoogleの利用規約で求められている\r\n4. Search Consoleのタグと一緒に、本人に1回だけ公開し直してもらう\r\n\r\n### 3-3. 動いているか確かめる\r\n\r\n1. 公開し直したら、スマホでサイトを開いてもらう\r\n2. GA4の左のメニューの「レポート」→「**リアルタイム**」を開くと、**今見ている人が1人**と出ればOK（数分かかることがある）\r\n3. サイトのLINEのボタンを1回押してもらう → 数分〜1日後に「管理」→「イベント」に `line_click` が出たら、横の星（または「キーイベントとしてマーク」）を押して、**大事な行動として数える**ようにする\r\n\r\n### 3-4. 本人に伝えること\r\n\r\n- 最初の1か月は、**「何人来たか」と「目的のボタンが何回押されたか」の2つだけ**見れば十分\r\n- 数字が少なくても、公開してすぐはそういうもの。SNSのプロフィールにURLを貼るのが、いちばん効く\r\n\r\n---\r\n\r\n## 4. うまくいかないとき\r\n\r\n| 症状 | 考えられること | 対応 |\r\n|---|---|---|\r\n| Search Consoleの「確認」で失敗する | タグを入れたあとに公開し直していない／別のページに入れた | トップページ（`index.html`）の `<head>` に入っているか見て、公開し直す |\r\n| GA4のリアルタイムに0人のまま | 測定IDの打ち間違い／広告ブロックのアプリが入っている | 測定IDを見比べる。別のスマホやブラウザで開いてみる |\r\n| 検索に出てこない | 公開してすぐ | 1〜2週間待つ。サイトマップが「成功しました」になっているか見る |\r\n"}, {"path": "Claude Code版/.claude/skills/homepage-pro/references/site-checklist.md", "url": null, "text": "# 仕上げのチェックリスト（検索・スマホ・読みやすさ・フォーム・法律）\r\n\r\n> サイトを作り終えたら、公開の前にClaudeが上から確認します。\r\n> 本人に見せるときは「チェックしました」だけで済ませず、**直した点を短く伝えます**。\r\n\r\n---\r\n\r\n## 1. 検索に見つけてもらうための設定（全ページ）\r\n\r\n- [ ] `<title>` を32文字以内で、ページごとに変える（名前と「何をしている人か」を前半に）\r\n- [ ] `<meta name=\"description\">` を80〜120文字で、ページごとに変える\r\n- [ ] `<link rel=\"canonical\">` を入れる（公開するURLが決まってから正式なURLにする）\r\n- [ ] **見出しの一番大きいもの（h1）は1ページに1つ**。h1→h2→h3の順番を飛ばさない\r\n- [ ] SNSでシェアされたときの表示（OGP）：`og:title`／`og:description`／`og:image`／`og:url`／`og:type`／`og:locale`／`og:site_name` と `twitter:card`\r\n- [ ] シェア用の画像 `ogp.jpg`（横1200×縦630px）を作る\r\n- [ ] 人物の情報をGoogleに伝える構造化データ（JSON-LD の `Person`。屋号やお店なら `Organization` や `LocalBusiness`）\r\n- [ ] `sitemap.xml` と `robots.txt` を置く\r\n- [ ] よくある質問を置くなら、見出しと答えがはっきり分かる形にする\r\n\r\n---\r\n\r\n## 2. スマホ対応（Googleはスマホで見た状態で評価します）\r\n\r\n- [ ] `<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">`\r\n- [ ] メニューはスマホでハンバーガーにする（隠すだけにしない。スマホでページを移動できなくなる）\r\n- [ ] 本文とフォームの入力欄は16px以上（16px未満だとiPhoneで勝手に拡大される）\r\n- [ ] 押す場所は44×44px以上\r\n- [ ] 横スクロールが出ない\r\n- [ ] 横に並べた要素は、スマホで1列にする\r\n- [ ] ⚠️ ヘッダーに `backdrop-filter`（すりガラス効果）を付けると、スマホのメニューがヘッダーの中に閉じ込められて開かなくなることがある → スマホではヘッダーの `backdrop-filter` を外す\r\n\r\n---\r\n\r\n## 3. 表示の速さ\r\n\r\n- [ ] 写真はWebP形式に変換して軽くする（`photos.md` の手順）\r\n- [ ] 一番上以外の画像には `loading=\"lazy\"`（一番上の画像には付けない）\r\n- [ ] 画像に `width` と `height` を書く（読み込み中にレイアウトがガタつかない）\r\n- [ ] Googleフォントを使うなら `preconnect` と `display=swap`\r\n- [ ] YouTubeを埋め込むなら、サムネイル画像を置いてクリックしたら読み込む形にする\r\n- [ ] ファビコン（ブラウザのタブに出る小さいアイコン）を置く\r\n\r\n---\r\n\r\n## 4. 読みやすさ・使いやすさ\r\n\r\n- [ ] 文字と背景の明るさの差が十分ある（薄い色の小さい文字を使わない）\r\n- [ ] すべての画像に `alt`（何が写っているかを具体的に。「画像」はだめ。飾りの画像は `alt=\"\"`）\r\n- [ ] キーボードで操作したときの枠線（`:focus-visible`）を消さない\r\n\r\n---\r\n\r\n## 5. 問い合わせフォーム\r\n\r\n- [ ] 項目は3〜5個（名前・メールアドレス・内容。必要なら件名）\r\n- [ ] 入力欄の上に文字のラベルを付ける（入力欄の中の薄い文字だけにしない）\r\n- [ ] 必須の項目は、色と「必須」の文字の両方で示す\r\n- [ ] 送ったあとに「送信しました」のページ（`thanks.html`）を出す\r\n- [ ] ボタンの文字は「送信」より「相談する」「問い合わせる」など、何が起きるか分かる言葉にする\r\n- [ ] **ロボットによるいたずら送信の対策を最初から入れる**（Netlifyの場合の入れ方は `publish-netlify.md`）\r\n- [ ] 公開したら、**自分で1回送ってみて、通知のメールが届くか**を確かめる\r\n\r\n---\r\n\r\n## 6. 法律・個人情報\r\n\r\n- [ ] **フォームで名前やメールアドレスを受け取るなら、プライバシーポリシーのページを作り、フッターからリンクする**（雛形＝`templates/privacy-policy.md`）\r\n- [ ] アクセス解析（Googleアナリティクスなど）を入れるなら、そのことをプライバシーポリシーに書く\r\n- [ ] 商品やサービスをネットで申し込み・購入できるようにするなら、特定商取引法にもとづく表記が必要になる。「問い合わせを受けるだけ」のサイトなら通常は不要。迷ったら本人に確認してもらう\r\n- [ ] **自宅の住所・個人の電話番号は、本人が「載せたい」と言わない限り載せない**\r\n- [ ] 実績に会社名や数字を載せるときは、**相手に掲載の許可を取ったか**を本人に確認する（秘密保持の約束がある仕事は載せない）\r\n- [ ] お客様の声を載せるときは、本人の許可を取ったものだけにする\r\n- [ ] 写真やイラストは、**使ってよい条件を満たしたものだけ**（`photos.md`）\r\n\r\n---\r\n\r\n## 7. 公開前の最終確認\r\n\r\n- [ ] 全部のリンクを押して、つながっているか\r\n- [ ] スマホ幅で全ページを見る（メニューの開閉・フォーム・横スクロール）\r\n- [ ] 見つからないページ用の `404.html` がある\r\n- [ ] 誤字脱字がない。「（デモ）」「〇〇」などの仮の文字が残っていない\r\n- [ ] `design-rules.md` の「禁止事項」と「微妙を言葉にする10項目」を上から当てる\r\n\r\n---\r\n\r\n## 8. 公開したあと（作っただけでは見られない）\r\n\r\n本人に、次のことを必ず伝えます。\r\n\r\n- **SNSのプロフィール欄に、サイトのURLを貼る**（一度貼れば、ずっと人が流れてくる。いちばん効く）\r\n- 「サイトを作りました」とSNSで一度お知らせする\r\n- 実績を増やしたら、サイトとSNSの両方に出す\r\n- Googleの「Search Console（サーチコンソール）」に登録して、`sitemap.xml` を送る（検索に早く載りやすくなる）\r\n"}, {"path": "Claude Code版/.claude/skills/homepage-pro/references/参考サイトの見方.md", "url": null, "text": "# 参考サイトの見方（URLを受け取ったら）\r\n\r\n> 参考サイトは、あくまで参考。雰囲気（色の数・余白・写真の使い方・落ち着き）を参考にするだけで、真似しすぎない。\r\n> 見えなかったことは、推測で書かない。\r\n\r\n---\r\n\r\n## 1. 文字と並び方を読む（WebFetch）\r\n\r\n- WebFetchでURLを読み、見出しの言葉・章の並び・実績の見せ方（名前・分類・年など）を書き出す\r\n- ⚠️ WebFetchで分かるのは、文字と並び方だけ。**写真や色は分からない**\r\n\r\n## 2. 見た目を撮って確かめる\r\n\r\nパソコンに入っているブラウザを、画面を出さずに動かして、サイトの一番上をパソコンの幅とスマホの幅で撮る。画像は `サイトの設計/` に保存して、撮れた画像を見る。\r\n\r\n**Windows（PowerShell・Edgeを使う）**\r\n\r\n```powershell\r\n$edge = \"C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe\"\r\n$url  = \"（参考サイトのURL）\"\r\n& $edge --headless=new --disable-gpu --hide-scrollbars --window-size=1280,900 --timeout=30000 --user-data-dir=\"$env:TEMP\\hp-ref-pc\" --screenshot=\"$PWD\\サイトの設計\\参考_PC.png\" $url\r\n& $edge --headless=new --disable-gpu --hide-scrollbars --window-size=390,844 --timeout=30000 --user-data-dir=\"$env:TEMP\\hp-ref-sp\" --screenshot=\"$PWD\\サイトの設計\\参考_スマホ.png\" $url\r\n```\r\n\r\n- コマンドはすぐ戻ってくる。**40秒ほどたってから**、2枚の画像ができているか確かめて開く\r\n- 写真が写っていない（ほぼ無地で、文字だけ）なら、写真の読み込みが間に合っていない。`--timeout=60000` にして撮り直す\r\n- 見終わったら、撮影のために動いたEdgeだけを止める（ふだん使っているEdgeは止めない）\r\n\r\n```powershell\r\nGet-CimInstance Win32_Process -Filter \"Name='msedge.exe'\" | Where-Object { $_.CommandLine -like \"*hp-ref*\" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }\r\n```\r\n\r\n**Mac（ターミナル・Chromeを使う）**\r\n\r\n```bash\r\nCHROME=\"/Applications/Google Chrome.app/Contents/MacOS/Google Chrome\"\r\nURL=\"（参考サイトのURL）\"\r\n\"$CHROME\" --headless=new --hide-scrollbars --window-size=1280,900 --timeout=30000 --user-data-dir=/tmp/hp-ref-pc --screenshot=\"$PWD/サイトの設計/参考_PC.png\" \"$URL\" &\r\n\"$CHROME\" --headless=new --hide-scrollbars --window-size=390,844 --timeout=30000 --user-data-dir=/tmp/hp-ref-sp --screenshot=\"$PWD/サイトの設計/参考_スマホ.png\" \"$URL\" &\r\n```\r\n\r\n- 40秒ほどたってから画像を確かめ、見終わったら `pkill -f hp-ref` で止める。写真が写っていなければ `--timeout=60000` にして撮り直す\r\n- Chromeが入っていない、または撮れなかったときは 3 へ\r\n\r\n**撮れる範囲**：一番上（最初に見える画面）だけ。下の方の並び方は、1 の文字で補う。\r\n\r\n⚠️ **色の数や書体のような「数字」だけを読んで真似しない。**数字はサイトの規律で、画面の印象を作っているのは**写真の量・写真つきカードの数・背景の色の変化**。撮った画像で、この3つも数えて表に書く（数字だけ真似すると、余白しかない画面になる）\r\n\r\n## 3. 撮れなかったとき\r\n\r\n- 写真と色のことは、推測で書かない。「写真と色は見られなかったので、文字と並び方だけを参考にします」と本人に伝える\r\n- 本人が画面を貼ってくれるなら、それも見る（無理には頼まない）\r\n\r\n## 4. 本人への伝え方\r\n\r\n1. 最初に「参考サイトは、雰囲気を参考にするだけです。真似しすぎないようにします」と伝える\r\n2. 見えたものを表にする\r\n\r\n| 参考にする | 参考にしない |\r\n|---|---|\r\n| （例）一番上は、画面の端まで広げた室内の写真 | （例）英字の大文字の見出し → 見出しは日本語だけ |\r\n\r\n- 表に書くのは、実際に見えたものだけ。見えていないものは書かない\r\n- 撮った画像は `サイトの設計/` に残す（採点係が「似すぎていないか」を見るときに使う）\r\n"}, {"path": "Claude Code版/.claude/skills/homepage-pro/references/図鑑_あしらい.html", "url": "ashirai.html", "text": null}, {"path": "Claude Code版/.claude/skills/homepage-pro/references/図鑑_動き.html", "url": "motion.html", "text": null}, {"path": "Claude Code版/.claude/skills/homepage-pro/references/templates/privacy-policy.md", "url": null, "text": "# プライバシーポリシーの雛形（お店・会社・個人事業のサイト用）\r\n\r\n> Claudeへ：`privacy.html` を作るときは、この雛形の【 】を本人の情報で埋める。\r\n> **本人に「この内容で公開してよいか」を必ず確認する。** 法律の専門家の確認を受けたものではないことも伝える。\r\n> アクセス解析を入れない場合は、「4. アクセス解析について」を削除する。\r\n\r\n---\r\n\r\n# プライバシーポリシー\r\n\r\n【サイトに出す名前・屋号】（以下「当サイト」といいます）は、当サイトでお預かりする個人情報を、以下のとおり取り扱います。\r\n\r\n## 1. お預かりする情報\r\n\r\n当サイトのお問い合わせフォームから、次の情報をお預かりします。\r\n\r\n- お名前\r\n- メールアドレス\r\n- お問い合わせの内容\r\n\r\n## 2. 利用する目的\r\n\r\nお預かりした情報は、次の目的にだけ利用します。\r\n\r\n- お問い合わせへの返信\r\n- ご依頼いただいたお仕事に関するご連絡\r\n\r\n## 3. 第三者への提供\r\n\r\n法令にもとづく場合を除き、ご本人の同意なく、お預かりした情報を第三者に提供することはありません。\r\nなお、お問い合わせフォームの受け付けには、外部のサービス（【Netlify】）を利用しています。\r\n\r\n## 4. アクセス解析について\r\n\r\n当サイトでは、サイトの利用状況を知るために【Googleアナリティクス】を利用しています。\r\nGoogleアナリティクスは、Cookieを使って、個人を特定しない形で利用状況の情報を集めます。\r\nCookieは、ブラウザの設定で無効にできます。\r\n\r\n## 5. 情報の管理\r\n\r\nお預かりした情報は、漏えいや紛失が起きないよう、適切に管理します。\r\n\r\n## 6. 開示・訂正・削除のご依頼\r\n\r\nご自身の情報の確認・訂正・削除をご希望の場合は、下記のお問い合わせ先までご連絡ください。ご本人であることを確認したうえで対応します。\r\n\r\n## 7. お問い合わせ先\r\n\r\n【サイトに出す名前・屋号】\r\nお問い合わせ：【お問い合わせフォームのページのURL、またはメールアドレス】\r\n\r\n## 8. このポリシーの変更\r\n\r\nこのポリシーの内容は、必要に応じて変更することがあります。変更した場合は、このページでお知らせします。\r\n\r\n【制定日：2026年◯月◯日】\r\n"}, {"path": "Claude Code版/.claude/skills/homepage-pro/scripts/make_photos.py", "url": null, "text": "# -*- coding: utf-8 -*-\n\"\"\"写真の指示文ファイルから、Gemini API で写真を作る。\n\n使い方:\n    python make_photos.py サイトの設計/写真の指示文.md site/images\n    python make_photos.py --check      … キーがあるか・使えるかだけ確かめる（キーの中身は表示しない。料金はかからない）\n\n指示文ファイルの形:\n    ## hero.webp | 16:9\n    （指示文。次の ## までが1枚分）\n\nAPIキー: 環境変数 GEMINI_API_KEY か、今いるフォルダの .env に GEMINI_API_KEY=... と書く。\nモデル: 環境変数 GEMINI_IMAGE_MODEL で変えられる（既定は下の DEFAULT_MODEL）。\n追加のインストールは不要（Python の標準機能だけで動く）。WebP への変換だけ Pillow があれば行う。\n\"\"\"\nimport base64\nimport json\nimport os\nimport re\nimport sys\nimport urllib.error\nimport urllib.request\n\n# Windowsでも日本語の案内が文字化けしないように\nif hasattr(sys.stdout, \"reconfigure\"):\n    sys.stdout.reconfigure(encoding=\"utf-8\")\n\n# 既定は安い方（1枚およそ6円。2026-09に実測）。写真の質は高い方と変わらない。\n# 画像の中に日本語の文字を入れたいときだけ、GEMINI_IMAGE_MODEL=gemini-3-pro-image にする（考える分の料金が上乗せされる）\nDEFAULT_MODEL = \"gemini-2.5-flash-image\"\n\n\ndef load_key():\n    key = os.environ.get(\"GEMINI_API_KEY\")\n    if key:\n        return key.strip()\n    if os.path.exists(\".env\"):\n        for line in open(\".env\", encoding=\"utf-8\"):\n            if line.strip().startswith(\"GEMINI_API_KEY\"):\n                return line.split(\"=\", 1)[1].strip().strip(\"\\\"'\")\n    return None\n\n\nPLACEHOLDER = \"ここにキーを貼る\"\n\n\ndef check():\n    \"\"\"キーがあるか・使えるかを確かめる。キーの中身は表示しない。モデルの一覧を取るだけなので料金はかからない。\"\"\"\n    key = load_key()\n    if not key or key == PLACEHOLDER:\n        if os.path.exists(\".env.txt\"):\n            print(\"キーが見つかりません。「.env.txt」というファイルがあります。名前を「.env」に変えてください\")\n        elif key == PLACEHOLDER:\n            print(\"キーが見つかりません。.env の「ここにキーを貼る」を、キーに置き換えて保存してください\")\n        else:\n            print(\"キーが見つかりません（.env に GEMINI_API_KEY=… の行がありません）\")\n        sys.exit(1)\n    req = urllib.request.Request(\n        \"https://generativelanguage.googleapis.com/v1beta/models?pageSize=1\",\n        headers={\"x-goog-api-key\": key},\n    )\n    try:\n        with urllib.request.urlopen(req, timeout=30):\n            pass\n    except urllib.error.HTTPError as e:\n        print(f\"キーが正しくないようです（{e.code}）。キーをコピーし直して、.env に貼り直してください\")\n        sys.exit(1)\n    except urllib.error.URLError:\n        print(\"Googleにつながりませんでした。インターネットの接続を確かめてください\")\n        sys.exit(1)\n    print(\"キーは使えます（キーの中身は表示していません）\")\n\n\ndef explain_error(code, msg):\n    \"\"\"失敗の理由を、分かる言葉にする。分からないときは None。\"\"\"\n    low = msg.lower()\n    if \"free_tier\" in low or \"limit: 0\" in low or \"billing\" in low:\n        return (\"写真を作るには、Google AI Studioで支払いの設定（Set up billing）が必要です。\"\n                \"photos.md の「料金と支払いの設定」を見てください\")\n    if code in (400, 401, 403) and (\"api key\" in low or \"api_key\" in low):\n        return \"キーが正しくないようです。キーをコピーし直して、.env に貼り直してください\"\n    return None\n\n\ndef parse_prompts(path):\n    text = open(path, encoding=\"utf-8\").read()\n    items = []\n    for block in re.split(r\"^## \", text, flags=re.M)[1:]:\n        head, _, body = block.partition(\"\\n\")\n        name, _, ratio = head.partition(\"|\")\n        prompt = body.strip()\n        if prompt:\n            items.append((name.strip(), ratio.strip() or \"16:9\", prompt))\n    return items\n\n\ndef generate(key, model, prompt, ratio):\n    url = f\"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent\"\n    body = {\n        \"contents\": [{\"parts\": [{\"text\": prompt}]}],\n        \"generationConfig\": {\n            \"responseModalities\": [\"IMAGE\"],\n            \"imageConfig\": {\"aspectRatio\": ratio},\n        },\n    }\n    req = urllib.request.Request(\n        url,\n        data=json.dumps(body).encode(\"utf-8\"),\n        headers={\"x-goog-api-key\": key, \"Content-Type\": \"application/json\"},\n    )\n    with urllib.request.urlopen(req, timeout=180) as res:\n        data = json.loads(res.read().decode(\"utf-8\"))\n    for part in data[\"candidates\"][0][\"content\"][\"parts\"]:\n        if \"inlineData\" in part:\n            return base64.b64decode(part[\"inlineData\"][\"data\"])\n    return None\n\n\ndef save(raw, out_path):\n    \"\"\"WebP で保存する。Pillow が無ければ、元の形式（PNG）のまま保存する。\"\"\"\n    try:\n        from io import BytesIO\n        from PIL import Image\n        img = Image.open(BytesIO(raw)).convert(\"RGB\")\n        if img.width > 1600:\n            img = img.resize((1600, round(img.height * 1600 / img.width)))\n        img.save(out_path, \"WEBP\", quality=85)\n        return out_path\n    except ImportError:\n        png_path = os.path.splitext(out_path)[0] + \".png\"\n        open(png_path, \"wb\").write(raw)\n        return png_path\n\n\ndef main():\n    if len(sys.argv) == 2 and sys.argv[1] == \"--check\":\n        check()\n        return\n    if len(sys.argv) != 3:\n        print(\"使い方: python make_photos.py 写真の指示文.md 保存先フォルダ　（キーの確認だけなら --check）\")\n        sys.exit(1)\n    key = load_key()\n    if not key or key == PLACEHOLDER:\n        print(\"GEMINI_API_KEY が見つかりません。photos.md の「Geminiのキーを確かめる」の順に進めてください\")\n        sys.exit(1)\n    model = os.environ.get(\"GEMINI_IMAGE_MODEL\", DEFAULT_MODEL)\n    os.makedirs(sys.argv[2], exist_ok=True)\n    for name, ratio, prompt in parse_prompts(sys.argv[1]):\n        out = os.path.join(sys.argv[2], name)\n        try:\n            raw = generate(key, model, prompt, ratio)\n        except urllib.error.HTTPError as e:\n            msg = e.read().decode(\"utf-8\", \"replace\")\n            why = explain_error(e.code, msg)\n            if why:\n                print(f\"{name}：失敗。{why}\")\n                sys.exit(1)  # 残りの写真も同じ理由で失敗するので、ここで止める\n            print(f\"{name}：失敗（{e.code}）{msg[:200]}\")\n            continue\n        if raw is None:\n            print(f\"{name}：写真が返ってきませんでした。指示文を変えてもう一度試してください\")\n            continue\n        print(f\"{name}：できました → {save(raw, out)}\")\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"path": "Codex版/.agents/skills/homepage-pro/SKILL.md", "url": null, "text": "---\r\nname: homepage-pro\r\ndescription: お店・会社・個人事業のホームページを、AIっぽくない「プロが作ったような」見た目で作る／作り直すスキル。「ホームページを作って」「サイトを作って」「このサイトをプロっぽく直して」「AIで作ったサイトがダサい」と言われたら使う。いきなり作らず、①選択式の質問（1問ずつ）→②一番記憶に残る1か所の宣言→③写真の用意→④作る→⑤画面を撮って採点→⑥直す→⑦Netlifyで公開（フォーム）→⑧独自ドメイン（お名前.com）→⑨Search ConsoleとGA4、の順で進める。プログラミングの知識がない人向け。\r\n---\r\n\r\n# ホームページをプロ級にするスキル\r\n\r\nAIは、何も言われないと「世の中でいちばん多い形の平均」を出します。だから、なんとなく頼むと、どこかで見たような「AIっぽいサイト」になります。\r\nこのスキルは、**プロのやり方を手順として持たせる**ことで、それを防ぎます。\r\n\r\n## 基本ルール（最初に必ず読む）\r\n\r\n- **いきなり作らない。** 下の STEP 1〜2 が終わるまで、HTMLもCSSも1行も書かない\r\n- **相手はプログラミングを知らない人。** 専門用語はその場で一言でかみ砕く（例：「CSS＝色や文字の大きさなど、見た目を決めるファイルです」）\r\n- **作業の前に「今から何をするか」、後に「何ができたか」を一言ずつ伝える。** 黙って10個まとめて作業しない\r\n- **事実を作らない。** 実績・お客様の声・数字・資格・創業年は、本人から聞いたことだけを書く。無いものは作らない\r\n- **参考サイトは、あくまで参考。** 参考にするのは雰囲気（色の数・余白・写真の使い方・落ち着き）だけ。文章・写真・ロゴ・レイアウトをそのまま写さない。できたサイトを参考サイトと並べて、一目で同じサイトだと分かるなら、真似しすぎなので直す（参考にしたサイトの持ち主に失礼で、トラブルのもとになる）\r\n- **作業は、今いるフォルダの中だけで行う。** ほかのファイルに触らない\r\n- 詳しいルールは `references/` にある。**該当するステップで必ず開いてから進める**\r\n\r\n## 全体の流れ（最初に本人に見せる）\r\n\r\n```\r\nホームページを作ります。この順番で進めます。\r\n\r\n1. 選択式の質問に、1問ずつ答えてもらう（全部で10問）\r\n2. 「このサイトで一番記憶に残る1か所」を決めて、設計図を見せる（飾りと動きは、図鑑を見て番号で選べる）\r\n3. 写真を用意する\r\n4. 作る\r\n5. 画面を撮って、採点係が点数をつける\r\n6. 点数が低いところを直して、完成\r\n7. インターネットに公開する（Netlify・無料）\r\n8. （希望する人だけ）自分だけの住所（ドメイン）を付ける\r\n9. Googleに知らせて、見た人の数を測れるようにする\r\n\r\n途中で止めても、フォルダに保存されているので続きから再開できます。\r\n```\r\n\r\n---\r\n\r\n## STEP 1｜聞き取り（選択式で、1問ずつ）\r\n\r\n**質問は1回に1問だけ。選択式で聞く。** 答えが来てから次の質問に進む。まとめて並べない（読むだけで疲れて、空欄が増えるため）。\r\n\r\n- **選択肢に番号を振って聞く**（「1〜4の番号で答えてください。自由に書いてもOKです」）。必ず「おまかせ」の選択肢を入れる\r\n- 最初に「全部で10問です。選ぶだけで進みます」と伝える。各質問の頭に「（3/10）」のように何問目かを書く\r\n- 答えに合わせて、次の質問の選択肢を作り直す（例：業種がリフォームなら、見る人の選択肢もリフォームのお客さんにする）\r\n- 「おまかせ」と言われたら、それまでの答えからいちばん良い案をAIが決めて、一言理由を添えて次へ進む\r\n\r\n| # | 聞くこと | 選択肢の作り方 |\r\n|---|---|---|\r\n| 1 | 何のお店・会社か | 業種を4つ（例：リフォーム・工務店／飲食店・カフェ／美容室・整体院／士業・教室） |\r\n| 2 | お店の名前 | 「自分で書く」／「おまかせ（名前の案を出す）」 |\r\n| 3 | 見た人にしてほしいこと（1つ） | 電話／問い合わせフォーム／予約／LINE登録 |\r\n| 4 | どんな人が見るか | 業種から考えたお客さん像を3つ＋おまかせ |\r\n| 5 | ★頼んだ人がどうなれるか（1文） | 1〜4の答えから作った案を3つ＋おまかせ |\r\n| 6 | 信じてもらえる材料（本当にあるものだけ） | 施工・実績の件数／資格・受賞／年数・地域での歴史／無し。「ある」を選んだら中身を書いてもらう。**無いものを作らない** |\r\n| 7 | ★参考にしたいサイト | URLを貼る／無し（おまかせ）。無しを選んだら「参考が無いと、どうしても平均点のサイトになりやすいです」と一度だけ伝える |\r\n| 8 | 写真 | 本物の写真がある／AIで作ってほしい／写真なしで作る |\r\n| 9 | 色 | ロゴや看板の色を指定する／雰囲気から提案（おまかせ）。提案する場合は、業種と見る人に合う色の組み合わせを3つ見せて選んでもらう |\r\n| 10 | 入れたくないもの | 特に無し／ある（書いてもらう） |\r\n\r\n- 参考サイトは**URLで受け取る**。**`references/参考サイトの見方.md` を開いて、書いてある順に実際に見る**（文字と並び方はWebFetchで読み、写真と色はパソコンのブラウザを画面なしで動かして一番上を撮って確かめる）。⚠️ **見えなかったことは推測で書かない。**最初に「参考サイトは、雰囲気を参考にするだけです。真似しすぎないようにします」と本人に伝えてから、見えたものを「参考にするところ／参考にしないところ」に分けて伝える。**文章・写真・ロゴ・デザインをそのまま写さない**\r\n- 聞き終わったら短くまとめて確認し、`サイトの設計/聞き取りメモ.md` に保存する\r\n\r\n## STEP 2｜「一番記憶に残る1か所」を宣言して、設計図を見せる\r\n\r\n**`references/design-rules.md` と `references/page-structure.md` を開いてから進める。**\r\n\r\nコードを書く前に、次の形にまとめて本人に見せ、**OKをもらってから作る。**\r\n\r\n```\r\nこの設計で作ります。\r\n\r\n・誰の、何のためのサイトか：\r\n・雰囲気（言葉3つ）：\r\n・一番記憶に残る1か所：（1つだけ。理由も1行）\r\n・色：ベース ◯◯ ／ 文字 ◯◯ ／ 差し色 ◯◯\r\n・文字の種類：見出し ◯◯ ／ 本文 ◯◯\r\n・参考サイトで参考にするところ（雰囲気だけ。真似しすぎない）：\r\n・ページの並び（上から）：\r\n  1. 一番上：（誰向け／どうなれるか／ボタン／信じられる理由）\r\n  2. ……（各セクションの「形」も書く。例：全幅の写真／左右2列／1行だけの余白）\r\n・写真を入れる場所：（◯か所）\r\n・あしらい：（あしらい図鑑の番号。例：1-1・3-1・6-5）\r\n・動き：（アニメーション図鑑の番号。例：A1・A9・C1）\r\n\r\n⚠️ 見出しやボタンの文言は、この段階で決めてしまいます。直したいところがあれば今のうちにどうぞ。\r\n```\r\n\r\n- 「一番記憶に残る1か所」は必ず**1つだけ**。ここに手数を集中させ、ほかは静かにする\r\n- 「ページの並び」は `design-rules.md` の「リズム」を満たすように組む（同じ形を続けない／余白だけの場所を1つ／写真に文字を少し重ねる場所を1つ）\r\n- **写真を入れられる場所には、できるだけ写真を入れる。** 写真を入れるだけで、サイトは一気に映える\r\n- **あしらいと動きは、図鑑を見て番号で選んでもらう。** 設計図を見せる前に、次の2つを順番に聞く。図鑑はブラウザで開く（Windowsは `start`、Macは `open` で開く）\r\n  1. **「あしらいの図鑑を見ますか？」**（あしらい＝見出し・区切り・写真・数字などにつける、ちょっとした飾り）。OKなら `references/図鑑_あしらい.html` を開き、「気になる番号を教えてください（例：3-1と6-5）」と伝えて、番号で選んでもらう\r\n     - 「控える」の札が付いた型は使わない\r\n     - 「おまかせ」なら、各章の「既定」の札が付いた型から、雰囲気に合うものを選ぶ\r\n     - あしらいは1サイト5〜6種類まで。足すより削る方が、プロの仕上がりに近づく\r\n  2. **「動きの図鑑を見ますか？」** OKなら `references/図鑑_動き.html` を開き、同じように番号で選んでもらう\r\n     - 「控える」の札が付いた型は使わない\r\n     - 「おまかせ」なら、既定の A1（ふわっと出る）・A9（ずらして出る）・C1（ボタンが少し浮く）・C3（下線が伸びる）・D3（スクロールでヘッダーが縮む）から選ぶ\r\n     - 動きは1サイト3種類まで（出現・ボタンに触れたとき・ヘッダー）。増やすほど安っぽくなる\r\n- 本人のOKが出たら `サイトの設計/設計図.md` に保存する\r\n\r\n## STEP 3｜写真を用意する\r\n\r\n**`references/photos.md` を開いてから進める。**\r\n\r\n- 本人の写真があれば、それを最優先で使う\r\n- 無ければ、**Codexの画像生成（`$imagegen`）で写真を作る**。指示文は `サイトの設計/写真の指示文.md` に先に書き出し、本人の確認を取ってから作る。画像生成が使えない環境なら、指示文だけ用意してサイトには仮の枠を置く\r\n- ⚠️ **AIで作った写真を「施工事例」「メニュー・商品」「店内」「スタッフ」「お客様」として載せない。** 実際の仕事・料理・人ではないものを、本物のように見せることになるため（料理や商品なら、実物と違うものを見せることになる）。そこは「本物の写真に差し替える場所」として仮の枠にする\r\n- 写真が揃ったら、**サイトを作る前に一度、写真だけを本人に見せる**（「この写真で作ってよいですか？」）\r\n\r\n## STEP 4｜作る\r\n\r\n- **HTMLとCSS（と必要最小限のJavaScript）だけで作る。** インストールや準備が要る仕組みは使わない\r\n- 置き場所：\r\n\r\n```\r\nsite/\r\n  index.html\r\n  style.css\r\n  script.js     ← 必要なときだけ（スマホのメニューの開閉など）\r\n  images/       ← 写真（WebP形式に軽くしたもの）\r\n  privacy.html  ← プライバシーポリシー（フォームかGA4を使うとき。templates/privacy-policy.md をもとに）\r\n  thanks.html   ← 問い合わせの送信完了ページ（フォームを置くとき）\r\n  404.html      ← 見つからないページ\r\n  ogp.jpg       ← SNSでシェアされたときの画像（1200×630px）\r\n  favicon.png   ← ブラウザのタブのアイコン\r\n  robots.txt\r\n  sitemap.xml   ← 公開するURLが決まってから正式なURLにする\r\nサイトの設計/    ← 聞き取りメモ・設計図・写真の指示文・採点結果（公開しない）\r\n```\r\n\r\n- `references/design-rules.md` のルールをすべて守る。特に「❌やらない → ✅代わりにこうする」\r\n- 文章は `references/page-structure.md` の「文章の書き方」に従う（決まり文句を使わない・「できること」でなく「どうなれるか」まで書く）\r\n- 本人があとで直しやすいように、HTMLの各セクションの前に日本語の目印を入れる（例：`<!-- ここから：施工の流れ -->`）\r\n- 目的が「問い合わせ」なら、フォームはNetlifyで受け取れる形で作る（`references/publish-netlify.md` の「4. 問い合わせフォーム」）。LINEなら、ボタンのリンク先に友だち追加のURLを入れる（本人に管理画面から発行したURLをもらう。手で組み立てない）\r\n- **SEOの設定（検索に見つけてもらうための設定）を、作る段階で必ず入れる**（`references/site-checklist.md` の「1」）。後回しにしない\r\n  - ページのタイトル（32文字以内）と説明文（80〜120文字）に、お店の名前・地域・何をしているかを入れる\r\n  - 見出しの一番大きいもの（h1）は1ページに1つ\r\n  - SNSでシェアされたときの表示（OGP）と `ogp.jpg`\r\n  - Googleにお店の情報を伝える構造化データ（お店なら `LocalBusiness`。住所・電話・営業時間は本人から聞いた本当のものだけ）\r\n  - `sitemap.xml` と `robots.txt`、canonical（URLが決まるまでは仮で置き、公開先が決まったら書き換える）\r\n  - すべての写真に、何が写っているかの説明（`alt`）\r\n  - 入れたら本人に「検索に見つけてもらうための設定も入れました」と一言伝える。**「検索で上位に出る」とは言わない**\r\n- 作り終えたら `references/site-checklist.md` を上から確認して、直せるものは直す\r\n\r\n## STEP 5｜画面を撮って、採点する\r\n\r\n**作ったら、必ず自分の目で見てから「できました」と言う。** Codexは画面を見ずにCSSを書いているので、見た目のズレに気づけない。\r\n\r\n1. **パソコンの幅とスマホの幅で画面を撮る**（ブラウザを操作できる道具があれば使う。無ければ本人に開いてもらい、スクリーンショットを貼ってもらう）\r\n2. **採点係になりきって**、`references/critic.md` の基準で100点満点の採点をする。作った本人の目線を捨て、撮った画面と `サイトの設計/設計図.md` だけを見て、忖度せずに点をつける\r\n3. 結果を `サイトの設計/採点結果.md` に保存し、本人に**点数と、直すところ上位3つ**を見せる\r\n\r\n## STEP 6｜直して、完成\r\n\r\n1. 採点の「❌→✅」を上から直す\r\n2. もう一度撮って、採点し直す（**最大3回まで**。3回やって残ったものは、本人に正直に伝える）\r\n3. 本人に完成版を見せる。「なんか微妙」と言われたら、感覚で直さず `design-rules.md` の「なんか微妙を言葉にする10項目」を上から当てて、「◯番が原因でした」と伝えてから直す\r\n\r\nできたら、こう伝える。\r\n\r\n```\r\nできました。\r\nAIで作った写真を使っている場所は、本物の写真に差し替えると、さらに良くなります。\r\n差し替えたいときは「◯◯の写真を差し替えて」と言ってください。\r\n\r\n次は、インターネットに公開します。進めてよいですか？\r\n```\r\n\r\n---\r\n\r\n## STEP 7｜インターネットに公開する（Netlify）\r\n\r\n**`references/publish-netlify.md` を開き、書いてある順番どおりに、1つずつ本人に操作してもらう。**\r\n\r\n- アカウント作成 → `site` フォルダをドラッグして公開 → アドレスの名前を変える → フォームの受け付けをオンにして通知メールを設定 → テスト送信\r\n- ⚠️ 無料枠は公開し直すたびに減る。**直すことはまとめて、公開し直すのは1回に**\r\n- ⚠️ アカウント作成・ログイン・ボタン操作は本人にしてもらう。Codexはパスワードを聞かない・預からない\r\n\r\n## STEP 8｜自分だけの住所（ドメイン）を付ける（希望する人だけ）\r\n\r\n**`references/domain-onamae.md` を開いて、書いてある順番どおりに案内する。**\r\n\r\n- まず「付ける／今は付けない」を選択式で聞く\r\n- 料金は、**1年目の安さでなく、2年目からの更新料金で選んでもらう**。金額は必ず申し込み画面の合計で本人に確認してもらう（料金は変わるため）\r\n- お名前.comで買う → Netlifyでドメインを登録 → お名前.comのネームサーバーをNetlifyのものに切り替える → 反映を待つ（最大48時間ほど）\r\n- つながったら、Codexがcanonical・OGP・`sitemap.xml`・`robots.txt` のURLを新しいドメインに書き換える（**公開し直すのは STEP 9 のタグと一緒に1回**）\r\n\r\n## STEP 9｜Googleに知らせて、見た人の数を測る（Search Console・GA4）\r\n\r\n**`references/search-console-ga4.md` を開いて、書いてある順番どおりに案内する。**\r\n\r\n- Search Consoleの確認用タグ・GA4のタグ・ドメインの書き換えを**そろえてから、1回だけ公開し直す**\r\n- Search Console：登録 → 確認 → `sitemap.xml` を送信 → トップページのインデックス登録をリクエスト\r\n- GA4：測定IDをもらってタグを入れる → 目的のボタンが押された回数も測る → リアルタイムで確認 → キーイベントにする\r\n- プライバシーポリシーに、GA4を使っていることを書く\r\n\r\n最後にこう伝えて終わる。\r\n\r\n```\r\n公開おめでとうございます！\r\nサイトは「持っているだけ」では見られません。\r\nまずは、SNSのプロフィール欄とLINEのあいさつ文に、サイトのURLを貼ってください。\r\n1〜2週間たったら、Search Consoleで「どんな言葉で検索されたか」を一緒に見てみましょう。\r\n```\r\n"}, {"path": "Codex版/.agents/skills/homepage-pro/references/critic.md", "url": null, "text": "# 採点の基準（採点係が使う）\r\n\r\n> **画面を見ずに採点しない。** 必ず撮った画面を見てから点数をつけます。撮れなかったら「撮れなかった」と書き、想像で採点しません。\r\n\r\n## 見るもの\r\n\r\n- パソコンの幅：一番上・真ん中・一番下の3枚\r\n- スマホの幅（390px）：一番上・真ん中の2枚\r\n- `サイトの設計/設計図.md`（**設計図とのズレも減点**）\r\n- 参考サイトがあるときは、聞き取りのときに見た参考サイトの画面も見る。**一目で同じサイトだと分かるほど似ていたら（並べ方・見出しの言葉・写真の撮り方がそっくり）、❌として必ず挙げる**（参考サイトは雰囲気を参考にするだけ）\r\n\r\n## 点数のつけ方（100点満点）\r\n\r\n| 区分 | 配点 | 見ること |\r\n|---|---|---|\r\n| AIっぽさが無いか | 30 | `design-rules.md` の「AIっぽさの代表5つ」と禁止事項。1つ当たるごとに減点 |\r\n| 一番記憶に残る1か所 | 15 | 「このサイトで一番記憶に残るのは？」に**1つで**答えられるか。設計図で決めた場所と同じか |\r\n| 写真 | 20 | 入れられる場所に写真が入っているか／端まで使う・寄りで切るなど切り方に意図があるか／明るさと色味がそろっているか |\r\n| リズム | 10 | 同じ形の章が続いていないか／余白だけの場所があるか／写真に文字が重なる場所が1か所あるか |\r\n| 伝わるか | 15 | 一番上の4つ（誰向け・どうなれるか・ボタン・信じていい理由）が、スクロールせずに分かるか／決まり文句が無いか／ボタンの文言が具体的か |\r\n| 細部とスマホ | 10 | 見出しの改行位置／1行の長さ／文字の小ささ・横スクロール・ボタンの押しやすさ（スマホ） |\r\n\r\n## 返し方\r\n\r\n- 冒頭に**総合点と一言**（例：「72点。減点は少ないが、写真が枠に収まっていて記憶に残らない」）\r\n- 直すところは**影響の大きい順に最大7つ**。1つずつこの形で：\r\n\r\n```\r\n❌ 何が・どこで（何枚目の画面・どの章）\r\n✅ 具体的な直し方（CSSの値まで。例：padding-block: 120px／写真を width: 100vw で端まで）\r\n　 なぜ　非エンジニアに伝わる1行\r\n```\r\n\r\n- 良いところも2つ書く（残すべきものが分かるように）\r\n- **飾りを足す提案はしない**（線・アイコン・番号・英字の飾り・グラデーションは禁止側）。足すなら余白・大きさ・写真・写真の切り方\r\n- **採点の間は、コードを直さない。** 採点を書き終えてから、STEP 6 で直す\r\n- 全体で1,200字以内。読むのはプログラミングを知らない人\r\n"}, {"path": "Codex版/.agents/skills/homepage-pro/references/design-rules.md", "url": null, "text": "# デザインのルール（AIっぽさを消して、プロが作ったように見せる）\n\n> このスキルでサイトを作るときに、Codexが必ず守るルールです。\n> AIは、何も指示されないと「世の中でいちばん多い形の平均」を出します。だから、**平均に戻らないように、数値と禁止事項で縛ります。**\n> **減点を消すルール（1〜3）**と、**プロっぽさを足すルール（4）**の2種類があります。両方やって初めて「プロが作った」に見えます。\n\n---\n\n## 1. 数値のルール\n\n| 項目 | ルール |\n|---|---|\n| 余白 | セクションの上下は120px以上（スマホは80px前後）。余白の値は8の倍数（8・16・24・32・48・64・96・128）でそろえる |\n| 色 | ベース・文字色・差し色1色の3色が基本。多くても4色。真っ黒（#000）と真っ白（#fff）は使わず、墨色（#1A1A1A前後）とオフホワイトにする |\n| フォント | 見出し1種＋本文1種の**2種類まで**。日本語サイトは日本語フォント（Noto Sans JP、Zen Kaku Gothic New、Shippori Mincho など）から、雰囲気で選ぶ |\n| 文字サイズ | 見出し・小見出し・本文の**3種類まで** |\n| 行間 | 本文は1.8〜2.0、見出しは1.2〜1.4 |\n| 字間 | ゴシックの見出しは-0.02em、明朝の見出しは0.02〜0.05em |\n| 1行の長さ | 本文は全角35〜40字（`max-width: 40em` 前後） |\n| 角丸 | サイト全体で統一する（0か16px。ボタンだけ999px）。8pxをあちこちに使わない |\n| 影 | ほぼ見えないくらい（rgba(0,0,0,0.06)以下）か、1pxの線で区切る |\n| 動き | ふわっと出るだけ。0.3〜0.8秒、動く距離は12〜16px。`prefers-reduced-motion` に対応する |\n| 配置 | 左寄せが基本。中央寄せは一番上の見出しなど要所だけ |\n\n---\n\n## 2. 禁止事項（❌やらない → ✅代わりにこうする）\n\n禁止だけ並べると、AIは別の変な手を打ちます。必ず「代わり」とセットで守ります。\n\n### まず、「AIっぽさ」の代表5つ（いちばん最初に消す）\n\nClaudeを作っているAnthropicが、公式ブログと公式のデザインのスキルで「ありがちだから避けるように」と名指ししているものから選んだ5つです（1・2＝公式ブログ、3〜5＝公式のデザインのスキル）。\n\n1. ❌ 紫〜藍色の色の移り変わり（グラデーション。特に白い背景の上） → ✅ ロゴや看板の色を単色で。変化をつけるなら同じ色の濃淡\n2. ❌ 何も考えずに選んだ書体（Inter・Roboto・Arial など、何も言わないと出てくる書体） → ✅ サイトの雰囲気に合わせて選んだ日本語の書体\n3. ❌ 同じ形のカード（同じ角丸・同じ影）が並ぶ → ✅ 内容ごとに並べ方を変える（写真と文章の左右交互／1つだけ大きく／表にする など）\n4. ❌ 見出しの上の小さな英字の飾り（「SERVICES」「ABOUT US」など）や、末尾の「→」 → ✅ 見出しは日本語だけで成立させる\n5. ❌ 順番に意味がない項目への番号（01／02／03） → ✅ 番号は、本当に手順や時系列になっているものにだけ付ける\n\n### そのほか\n\n- ❌ 紫から青へのグラデーション → ✅ 差し色は単色でベタ塗り。変化をつけるなら同じ色の濃淡\n- ❌ 英語の飾り見出し（ABOUT、SERVICE、WORKS、CONTACT などをセクションの上に小さく置く） → ✅ 見出しは日本語だけで成立させる。英語を使ってよいのは、名前・ロゴ・固有名詞だけ\n- ❌ 見出しの前に置く短い横線（──） → ✅ 文字の太さ・色・余白で区切る\n- ❌ 中身のない決まり文句（「革新的な」「最先端の」「〜を提供します」「お客様第一」） → ✅ 数字・固有名詞・具体的な場面で書く（`page-structure.md` の「文章の書き方」）\n- ❌ 大きい数字を3つ横に並べる飾り（「10年／500件／100%」） → ✅ 実績は、固有名詞と具体的な中身で見せる\n- ❌ 全部を中央寄せ → ✅ 左寄せを基本にして、グリッドの左端をそろえる\n- ❌ 絵文字をあちこちに置く → ✅ 区切りは余白と見出しで作る。アイコンが要るなら線の太さをそろえたSVG\n- ❌ 濃い影 → ✅ 極薄の影か、1pxの線\n- ❌ 3種類以上のフォント → ✅ 2種類まで\n- ❌ 注釈を付けないと意味が伝わらない見せ方（「※バーの長さは〜を基準にしています」など） → ✅ 注釈を書きたくなったら、その見せ方をやめる。数字はそのまま大きく見せる\n- ❌ 架空の実績・お客様の声・数字を入れる → ✅ 本人から聞いた事実だけを書く。まだ無いものは「（準備中）」と書くか、その項目を作らない\n- ❌ 「Web制作：〇〇」など、作った側のクレジットをフッターに入れる → ✅ 入れない\n- ❌ 写真を入れられる場所を、アイコンや図形で埋める → ✅ **できるだけ写真を入れる。**写真を入れるだけでサイトは一気に映える（アイコンで埋めると、どのお店か分からなくなる）\n- ❌ 全部のセクションが、白い背景に文字だけ → ✅ 画面の印象は**写真・写真つきのカード・背景の色の面**で作る。背景の色を1〜2か所変えて区切る\n- ❌ きれいでも、どの文章も説明していない画像（雰囲気づくりのためだけのイラストなど） → ✅ 「この画像は、どの文章の何を説明しているか」を1行で言える画像だけ置く\n- ❌ 並べた説明文の長さがバラバラ（1つだけ3行で、ほかは1行など） → ✅ 並ぶ項目は、文の数と文字数をそろえる\n- ❌ 新しく足す部品（送信前の確認画面・お知らせ欄など）を、角丸の枠や太い線の箱で囲う（AIが作る画面の典型） → ✅ 隣にある部品と同じ見た目にそろえる。区切りが要るなら余白か1pxの線\n- ❌ 帯や締めのセクションに、中身より多い余白を盛る → ✅ 余白は中身に合わせる。隣り合うセクションで上下の余白を二重に付けない（120px＋120pxで240pxもあく、など）\n- ❌ AIで作った写真を「施工事例」「メニュー・商品」「スタッフ」「お客様」「店内」として載せる（実在のお店の場合。料理や商品は、実物と違うものを見せることになる） → ✅ そこは本物の写真に差し替える場所として仮の枠にする。AIの写真は、雰囲気を伝える場所（一番上の背景・区切りの写真など）にだけ使う\n\n---\n\n## 3. 「なんか微妙」を言葉にする10項目\n\n完成したサイトを本人が見て「なんか微妙」と言ったら、**感覚で直さず、上から順に当てて原因を特定**します。直したら「◯番が原因でした」と一言添えます。8割は①〜③で見つかります。\n\n| # | 見るところ | 微妙に見えるとき | 直し方 |\n|---|---|---|---|\n| ① | 余白が足りているか | ぎゅっと詰まって安っぽい | セクションの上下の余白を1.5倍にする |\n| ② | 色が多すぎないか（白・グレー・黒以外で4色以上） | ごちゃごちゃする | ベース・文字色・差し色の3色に減らす |\n| ③ | 文字サイズが3種類を超えていないか | まとまりがない | 3種類に絞る |\n| ④ | 左端がそろっているか | ガタついて落ち着かない | 開始位置をそろえる |\n| ⑤ | 全部が中央寄せになっていないか | 招待状っぽい、AIっぽい | 左寄せを基本にする |\n| ⑥ | 影が濃くないか | 古く見える | 影を薄くするか線にする |\n| ⑦ | 角丸がバラバラになっていないか | 安定感がない | 同じ値にそろえる |\n| ⑧ | 写真が弱くないか（暗い・ぼやけ・雰囲気がバラバラ） | 全体が安く見える | 写真を差し替えるか、減らして文字で見せる。**CSSを直しても良くならない** |\n| ⑨ | 一番見てほしいものが、一番目立っているか | 何のサイトか伝わらない | 見てほしいもの以外を弱める |\n| ⑩ | スマホで崩れていないか | PCと別物に見える | 横スクロール・文字の小ささ・ボタンの押しやすさを直す |\n\n---\n\n## 4. プロっぽさを作る4つ（加点）\n\n1〜3を守っても「変ではないけど記憶に残らない」サイトにしかなりません。プロっぽさはこの4つで決まります。\n\n### ① 「一番記憶に残る1か所」を先に決める\n\nAIは全部を平均点で作ります。コードを書く前に「このサイトで一番記憶に残るのはここ」を1つだけ決めて、手数をそこに集中させます。ほかは静かにします。\n\n- 例：トップの大きな写真1枚／名前の見せ方／作品一覧の並べ方\n- ❌「いい感じに」「おしゃれに」で始める → ✅「一番記憶に残るのは◯◯」「参考サイトのこの部分のように」で始める\n\n### ② リズム（構成の緩急）\n\n全セクションが同じ高さ・同じ余白・「見出し＋カード3枚」の繰り返しになると、AIっぽくなります。\n\n- **同じ形のセクションを連続させない**\n- **1ページに1か所、余白だけの場所を作る**（短い一文だけのセクションなど）\n- **1か所、写真に文字を少し重ねる**\n\n作る前に「セクションの並び表」（順番・形・高さの目安）を書いて、同じ形が続いていないか確かめます。\n\n### ③ 写真の切り方\n\n- プロは大胆に切ります（端まで広げる、寄りで切る、横長にして片側に余白を作る）。AIは何でも枠に収めがちです\n- 1枚ずつ「端まで」「寄りで」と決めてから配置します\n- ページの中で写真の明るさと色味をそろえます。そろわない写真は使いません\n\n### ④ 細部の手仕事\n\n**日本語の組み方**\n- 見出しだけ、句読点やカッコの前後の空きを詰める（`font-feature-settings: \"palt\"`）。本文には付けない\n- **見出しの改行位置は手で決める**（意味の切れ目で改行する。単語の途中で折れたまま出さない）\n- 数字は等幅にする（`font-feature-settings: \"tnum\"`）\n\n**動き**\n- 出現は12〜16pxだけ動かす\n- 複数の要素は0.06秒ずつずらして出す\n- 加減速は `cubic-bezier(0.22, 1, 0.36, 1)` を基本にする\n- ホバーで変えるのは2つまで。動きの種類は3つまで（出現・ホバー・ヘッダーの変化）\n\n---\n\n## 5. 一番上（ファーストビュー）の原則\n\n- 一番見られる場所なので、手を抜かずに作り込む\n- ❌ キャッチコピー1行だけを置く（質素に見える） → ✅ **脇役を2〜3個置く**。例：コピーの上に「何のお店・会社か」を1行、コピーの下に一言の説明、最新のお知らせ\n- ❌ 文字が1文字ずつ出てくる、時間差でふわふわ出てくる → ✅ **最初からきちんと表示**し、動かすなら極めてゆっくり\n- ❌ 強すぎるズーム、マウスに追従する動き → ✅ さりげない動きだけ\n- 写真に文字を載せるときは、**一番明るい部分でも文字が読めるか**を確認する（暗い半透明の膜を重ねる）\n- スマホでは写真の見える位置がPCと変わるので、`object-position` をPCとスマホで別々に調整する\n\n---\n\n## 心得\n\n1. **引き算がプロ、足し算が素人**。迷ったら削る\n2. **余白と写真が9割**。迷ったら、写真を増やして文字を減らす\n3. **制約を与える**。数値と禁止事項で縛るほど、オリジナルになる\n"}, {"path": "Codex版/.agents/skills/homepage-pro/references/domain-onamae.md", "url": null, "text": "# 独自のアドレス（ドメイン）を付ける手順｜お名前.com\r\n\r\n> Codexは、この順番で**1つずつ**本人に操作してもらいます。1つ終わるごとに「できたら『できました』と送ってください」と伝えて待ちます。\r\n> 画面の表記は変わることがあります。案内と違ったら、スクリーンショットを貼ってもらって、画面に合わせて案内し直します。\r\n> **料金は2026年9月14日にお名前.comの公式ページで確認した数字です。** 料金は変わるので、申し込む前に画面の金額を必ず本人に確認してもらいます。\r\n\r\n---\r\n\r\n## 0. 最初に本人に説明すること\r\n\r\n```\r\nドメインは、サイトの「住所」のことです。\r\n今のサイトは「〇〇.netlify.app」という住所ですが、\r\nドメインを買うと「〇〇.com」のような、自分だけの住所にできます。\r\n\r\n【ドメインを付けるとよいこと】\r\n・名刺やSNSに載せたときに、ちゃんとした印象になる\r\n・サイトを置く場所（Netlify）を将来変えても、住所は変わらない\r\n\r\n【気をつけること】\r\n・毎年、更新の費用がかかる\r\n・更新を忘れると、サイトが見られなくなり、住所をほかの人に取られることもある\r\n\r\nなくてもサイトは公開できています。付けるかどうか、選んでください。\r\n```\r\n\r\n選択式で聞きます：**付ける／今は付けない（あとで付けられる）**\r\n\r\n---\r\n\r\n## 1. ドメインの種類を選ぶ\r\n\r\n### 料金の目安（お名前.com・税込）\r\n\r\n| 種類 | 1年目（新規登録） | 2年目からの更新（1年あたり） | 向いている人 |\r\n|---|--:|--:|---|\r\n| **.com** | 0円（1人1個まで。2個目からは750円） | **1,408円** | **迷ったらこれ。** 世界でいちばん使われていて、更新も比較的安い |\r\n| .net | 0円（1人1個まで。2個目からは750円） | 1,628円 | .comで欲しい名前が取られていたとき |\r\n| .jp | 0円（1人1個まで。2個目からは1,860円） | 3,124円 | 日本で活動していることを出したい人 |\r\n| ⚠️ .site | 0円（1人1個まで。2個目からは60円） | **4,268円** | **1年目が安くても、2年目から高くなるので注意** |\r\n| ⚠️ .online | 0円（1人1個まで。2個目からは60円） | **5,040円** | 同上 |\r\n\r\n⚠️ **上の金額に加えて、「サービス維持調整費」が上乗せされます。** 為替などを理由に、お名前.comが一時的に加えているもので、**割合は数ヶ月ごとに変わります**（2026年9月時点で26.25%）。たとえば .com の更新なら、**実際にはおよそ1,800円前後**になります。**正確な金額は、申し込み画面の合計で確認してください。**\r\n\r\n⚠️ **1年目の安さだけで選ばない。** 2年目からの更新料金を必ず見る。\r\n\r\n### 名前の決め方\r\n\r\n- **短く、読みやすく**（名前・活動名・屋号をローマ字で。例：`yamada-photo.com`）\r\n- ハイフンは1つまで。数字の0とアルファベットのOなど、紛らわしい文字は避ける\r\n- 口で伝えたときに、聞き間違えられない名前にする\r\n\r\n---\r\n\r\n## 2. お名前.comでドメインを買う\r\n\r\n1. https://www.onamae.com/ を開く\r\n2. 検索窓に、欲しい名前（例：`yamada-photo`）を入れて検索する\r\n3. 使える種類の一覧が出るので、選んだ種類（例：`.com`）にチェックを入れて、申し込みに進む\r\n4. 申し込み画面で、次を確認する\r\n   - **「Whois情報公開代行」（フーイズ情報公開代行）がオンになっているか**\r\n     - ドメインの持ち主の名前や住所は、誰でも調べられる仕組みになっています。**公開代行をオンにすると、お名前.comの情報に置き換わり、自宅の住所などが出なくなります。** 必ずオンにする\r\n   - **レンタルサーバーやほかのオプションのチェックは外す**\r\n     - サイトはNetlifyに置くので、**レンタルサーバーは要りません**\r\n     - 申し込み画面には、有料のオプションがいくつも出てきます。**ドメインだけを買う**\r\n   - **合計金額**（サービス維持調整費を含む）\r\n5. 会員登録（名前・住所・メールアドレスなど）と支払い方法を入力して、申し込みを完了する\r\n6. 登録したメールアドレスに、お名前.comからメールが届く（本人確認などの案内があれば、それに従う）\r\n\r\n### 買ったあとに本人に伝えること\r\n\r\n- お名前.comからは、**更新のお知らせや、ほかのサービスの案内メールがたくさん届きます。** 「更新期限が近い」というメールは大事なので、捨てずに確認する\r\n- **自動更新にしておくか**を決める。自動更新にしておけば、更新を忘れてサイトが止まることがない\r\n\r\n---\r\n\r\n## 3. ドメインをNetlifyのサイトにつなぐ\r\n\r\n「つなぐ」とは、`yamada-photo.com` を開いたときに、Netlifyに置いたサイトが表示されるように設定することです。\r\n**Netlify側で住所を登録 → お名前.com側で「このドメインはNetlifyが管理します」と設定**、の順番で行います。\r\n\r\n### 3-1. Netlify側：ドメインを登録する\r\n\r\n1. Netlifyでそのサイトを開き、**Domain management**（ドメインの管理）を開く\r\n2. **Add a domain**（ドメインを追加。**Add custom domain** の表記の場合もある）を押す\r\n3. 買ったドメイン（例：`yamada-photo.com`）を入力して進む\r\n4. 「このドメインを持っていますか」のような確認が出たら、進む\r\n5. **Netlify DNS**（Netlifyにドメインの管理を任せる）を設定する画面に進み、案内に沿って進める\r\n6. 最後に、**ネームサーバー**（ドメインの管理を担当するところ）が4つ表示される（例：`dns1.p01.nsone.net` のような形）。**この4つをメモする**\r\n\r\n### 3-2. お名前.com側：ネームサーバーをNetlifyに切り替える\r\n\r\n1. **お名前.com Navi**（お名前.comの管理画面。https://navi.onamae.com/ ）にログインする\r\n2. メニューの **「ネームサーバー／DNS」** → **「ネームサーバー設定」** を開く\r\n3. 対象のドメインにチェックを入れる\r\n4. **「他のネームサーバーを利用」** を選び、Netlifyでメモした **4つのネームサーバー** を1つずつ入力する\r\n5. 確認して、設定を完了する\r\n\r\n⚠️ 「ネームサーバー設定」と「DNSレコード設定」は**別のメニュー**です。今回使うのは「**ネームサーバー設定**」だけです。\r\n\r\n### 3-3. 反映を待つ\r\n\r\n- 切り替えが世界中に行きわたるまで、**数時間、長いと48時間ほど**かかります。すぐに表示されなくても慌てなくて大丈夫です\r\n- 反映されると、Netlifyが自動で **HTTPS**（アドレスの頭が `https://` になり、鍵マークが付く安全な通信）の設定をしてくれます\r\n- Netlifyの **Domain management** の画面で、ドメインの横に確認済みの表示が出ていればOK\r\n\r\n### 3-4. 表示を確認する\r\n\r\n- [ ] `https://yamada-photo.com` を開いて、サイトが表示される\r\n- [ ] `https://www.yamada-photo.com` を開いても、表示される（または自動で移動する）\r\n- [ ] アドレスの横に鍵マークが出ている\r\n\r\n---\r\n\r\n## 4. つながったあとにCodexがやること\r\n\r\n1. `index.html` などの canonical・OGPのURL、`sitemap.xml`、`robots.txt` を、**新しいドメインのURLに書き換える**\r\n2. 本人に、サイトを**公開し直して**もらう（`publish-netlify.md` の「6. サイトを更新するとき」）\r\n3. SNSのプロフィール欄のURLも、新しいアドレスに変えてもらう\r\n4. Googleの **Search Console**（サーチコンソール。Googleの検索にサイトを知らせる無料の道具）への登録を案内する\r\n\r\n---\r\n\r\n## うまくいかないとき\r\n\r\n| 症状 | 考えられること | 対応 |\r\n|---|---|---|\r\n| 2日たっても表示されない | ネームサーバーの入力ミス | お名前.com Naviの「ネームサーバー設定」で、4つが正しく入っているか見てもらう（スクリーンショットをもらって確認する） |\r\n| 「安全ではない」と表示される | HTTPSの設定がまだ | 反映直後はよくある。数時間待つ。Netlifyの Domain management で HTTPS の設定状況を見てもらう |\r\n| `www.` を付けると表示されない | wwwの設定がまだ | Netlifyの Domain management で、wwwのほうも登録されているか確認する |\r\n"}, {"path": "Codex版/.agents/skills/homepage-pro/references/page-structure.md", "url": null, "text": "# ページの組み立て方と、文章の書き方\r\n\r\n> 見た目がきれいでも、**見た人が「で、どうすればいいの？」と迷うサイト**は、プロの仕事になりません。\r\n> このファイルは、見た人に行動してもらう（電話・問い合わせ・予約など）ための組み立て方です。\r\n\r\n---\r\n\r\n## 1. 一番上（ファーストビュー）に置く4つ\r\n\r\n開いて最初に見える画面で、この4つが**スクロールしなくても**分かるようにします。\r\n\r\n| # | 置くもの | 例（リフォーム店） |\r\n|---|---|---|\r\n| ① | **誰のためのサイトか** | 「築30年を過ぎたお家の、水まわりのリフォーム」 |\r\n| ② | **頼むとどうなれるか** | 「毎朝の台所が、立つのが楽しみな場所に」 |\r\n| ③ | **次にやること（ボタン）** | 「無料で見積もりを頼む」 |\r\n| ④ | **信じていい理由**（本当にあるものだけ） | 「地域で施工320件」「一級建築士が在籍」 |\r\n\r\n- ④が無いお店は、無理に作らない。**写真（仕事の様子・お店の外観）で代わりに信頼を作る**\r\n- 背景に写真を置くときは、一番明るいところでも文字が読めるか確かめる\r\n\r\n## 2. 上から下への並び（基本の形）\r\n\r\nお店・会社のサイトは、見る人の頭の中の順番で並べます。\r\n\r\n1. **一番上**：上の4つ\r\n2. **困りごと**：「こんなことで困っていませんか」＝見る人が自分のことだと思える場面を3つくらい\r\n3. **できること**：困りごとに対して、何をしてくれるのか\r\n4. **選ばれる理由**：ほかのお店と違うところ（本当にあるものだけ）\r\n5. **仕事の様子・事例**：写真を大きく（本物の写真の場所）\r\n6. **流れ**：問い合わせてから終わるまで（ここは本当に手順なので、番号を付けてよい）\r\n7. **料金の目安**：載せられる範囲で。載せないなら「ご相談ください」と書く理由を一言\r\n8. **よくある質問**：頼む前に不安になることを先に答える\r\n9. **最後のボタン**：一番上と同じ行動を、もう一度\r\n\r\n- 全部入れなくてよい。**目的に要らない章は削る**（引き算がプロ）\r\n- 並びが決まったら、`design-rules.md` の「リズム」で、**同じ形の章が続いていないか**確かめる\r\n\r\n## 3. 文章の書き方\r\n\r\n### 「できること」で止めず、「どうなれるか」まで書く\r\n\r\n| 段階 | 例 |\r\n|---|---|\r\n| できること | システムキッチンの交換ができます |\r\n| だから何がいいか | 引き出しが奥まで開くので、しゃがまずに鍋が取れます |\r\n| **どうなれるか**（ここまで書く） | 毎朝の台所で、腰をかばわなくてよくなります |\r\n\r\n### 決まり文句を使わない\r\n\r\n| ❌ 決まり文句 | ✅ 代わりに |\r\n|---|---|\r\n| 革新的な／最先端の | 何が新しいのかを、そのまま書く |\r\n| 〜を提供します | 「〜します」「〜できます」 |\r\n| お客様第一／真心を込めて | 実際にやっていること（「工事の前日に、ご近所へ挨拶に回ります」） |\r\n| 高品質／安心・安全 | 数字や固有名詞（「10年保証」「◯◯メーカーの認定施工店」） |\r\n\r\n- **数字と固有名詞で書く。** ただし、本人から聞いた本当のものだけ\r\n- 1文を短く。1文に言いたいことは1つ\r\n\r\n### ボタンの文言\r\n\r\n- ❌「送信」「お問い合わせ」「詳しくはこちら」 → ✅ **押すと何が起きるか**を書く（「無料で見積もりを頼む」「空いている日を見る」）\r\n- ボタンのすぐ近くに、**押す前の不安を消す一言**を置く（「しつこい営業の電話はしません」「見積もりだけでも大丈夫です」）。本当に守れることだけ書く\r\n- 1ページで目指す行動は1つ。ボタンの種類を増やさない（選択肢が多いほど、人は迷って何も選ばない）\r\n\r\n## 4. 文言は、作る前に決める\r\n\r\n見出し・ボタン・一番上の文章は、**設計図の段階で本人に確認してから**作ります。\r\n作ったあとに文言が変わると、文字の長さが変わってレイアウトも崩れ、直しが倍になるためです。\r\n"}, {"path": "Codex版/.agents/skills/homepage-pro/references/photos.md", "url": null, "text": "# 写真の用意のしかた\r\n\r\n> **サイトの印象は、写真でほぼ決まります。** CSSをいくら直しても、写真が弱いと安く見えます。\r\n> 逆に言えば、**写真を入れるだけで、サイトは一気に映えます。** 写真を入れられる場所には、できるだけ入れます。\r\n\r\n---\r\n\r\n## 1. 使う写真の優先順位\r\n\r\n1. **本人が撮った本物の写真**（仕事の様子・お店の外観・道具・スタッフ）＝いちばん強い\r\n2. **AIで作った写真**（雰囲気を伝える場所だけ。下の「2」の注意を守る）\r\n3. **写真を使わない**（色・文字・余白で見せる）\r\n\r\n## 2. ⚠️ AIで作った写真の注意（必ず本人に伝える）\r\n\r\n- AIの写真は、**「実際の仕事」「実在の人」に見える場所には使わない**\r\n  - ❌ 施工事例・ビフォーアフター・メニュー（料理・飲み物）や商品の写真・スタッフ紹介・お客様の声の顔写真・「当店の店内」\r\n  - ✅ 一番上の背景、章と章の区切り、「こんな暮らしに」という雰囲気の写真\r\n- 実在のお店で使うときは、**あとで本物に差し替える場所を `サイトの設計/写真の差し替えリスト.md` に書き出しておく**\r\n- 人の顔は作らない（手元・後ろ姿・遠景ならよい）。本物の人と誤解されるため\r\n\r\n## 3. AIで写真を作る（Codexの画像生成）\r\n\r\n1. 設計図の「写真を入れる場所」ごとに、指示文（英語）を書いて `サイトの設計/写真の指示文.md` に保存する\r\n2. 本人に「この◯枚を作ります。よいですか？」と確認する\r\n3. Codexの画像生成（`$imagegen`）で1枚ずつ作り、`site/images/` に指示文ファイルのファイル名で保存する\r\n4. できた写真を本人に見せる。気に入らない1枚だけ「◯枚目をこう直して」で作り直す\r\n\r\n### 指示文の書き方（プロっぽく見せるコツ）\r\n\r\n- **全部の写真で、同じ光と色味を指定する**（例：`soft natural morning light, warm neutral tones`）。写真の雰囲気がバラバラだと、それだけで素人っぽく見える\r\n- **何を撮った写真かを具体的に**（❌ `a beautiful kitchen` → ✅ `a renovated Japanese kitchen with light oak cabinets, morning sun through a small window, a kettle on the stove`）\r\n- **文字を載せる写真は、文字を置く側を空けておく**（`empty space on the left for headline text`）\r\n- **必ず入れる一文**：`No text, no letters, no logos, no watermarks.`（AIは変な文字を入れがち）\r\n- 人を入れるなら `hands only` / `seen from behind` / `far away` にする\r\n- 形を指定する：一番上は横長（16:9）、事例やカードは 4:3 か 1:1\r\n\r\n### 指示文ファイルの形\r\n\r\n```\r\n## hero.webp | 16:9\r\nA renovated Japanese kitchen ... No text, no letters, no logos, no watermarks.\r\n\r\n## section-bath.webp | 4:3\r\nA bright bathroom ... No text, no letters, no logos, no watermarks.\r\n```\r\n\r\n`## ファイル名 | 形` の次の行から、次の `##` までが指示文です。\r\n\r\n## 4. 画像生成が使えないとき\r\n\r\n- `サイトの設計/写真の指示文.md` だけ作り、本人に「この指示文を Gemini や ChatGPT に貼ると、写真が作れます。できたら `site/images` に、書いてあるファイル名で保存してください」と伝える\r\n- サイトには**仮の枠**（薄いグレーの四角に「ここに◯◯の写真」と書いたもの）を置いて、レイアウトだけ先に完成させる\r\n\r\n## 5. 本人の写真を使うとき\r\n\r\n- `素材_元の写真/` に入れてもらう\r\n- 明るさ・色味がそろった写真を選ぶ。**暗い・ぼやけている写真は、使わない方が良い**と正直に伝える\r\n- 大きすぎる写真は表示が遅くなるので、横幅を小さくしてWebP形式にする（一番上の写真＝横1600px、そのほか＝横1000pxくらい）。Pythonが使えれば Pillow で変換する\r\n- 1枚ずつ「端まで広げる」「寄りで切る」「枠に収める」を決めてから置く（`design-rules.md` の「写真の切り方」）\r\n"}, {"path": "Codex版/.agents/skills/homepage-pro/references/publish-netlify.md", "url": null, "text": "# Netlify（ネットリファイ）で公開する手順\r\n\r\n> Codexは、この順番で**1つずつ**本人に操作してもらいます。\r\n> 1つ終わるごとに「できたら『できました』と送ってください」と伝えて待ちます。\r\n> **Netlifyの画面は英語です。** ボタンの名前は英語のまま書き、日本語で意味を添えます。\r\n> 画面の表記は変わることがあります。案内と違ったら、**スクリーンショットを貼ってもらって**、画面に合わせて案内し直します。\r\n> （2026年9月時点の情報です）\r\n\r\n---\r\n\r\n## 0. 最初に本人に説明すること\r\n\r\n```\r\nこれから、作ったサイトをインターネットに公開します。\r\n使うのは「Netlify（ネットリファイ）」という、サイトを置いておける無料のサービスです。\r\n\r\n公開すると、「〇〇.netlify.app」というアドレスで、誰でも見られるようになります。\r\n（独自のアドレスは、あとから付けられます）\r\n\r\n1つだけ、先に知っておいてほしいことがあります。\r\n```\r\n\r\n### ⚠️ 無料枠の仕組み（必ず伝える）\r\n\r\n- Netlifyの無料プランは、**毎月300「クレジット」**（使える量のポイント）が付きます\r\n- **サイトを公開し直すたびに15クレジット**使います。見に来た人の通信量でも減ります\r\n- **使い切ると、翌月までサイト全体が表示されなくなり、問い合わせフォームも止まります**\r\n- だから、**文章や写真の修正は、まとめて直してから1回で公開し直す**のがおすすめです。1文字直すたびに公開し直すと、すぐに減ります\r\n- 問い合わせフォームの送信は、クレジットを使いません\r\n\r\n---\r\n\r\n## 1. Netlifyのアカウントを作る\r\n\r\n本人に案内します。\r\n\r\n1. https://app.netlify.com/signup を開く\r\n2. 登録方法を選ぶ（**GitHub・GitLab・Bitbucket・Google・メールアドレス**などから選べる。よく分からなければ、Googleアカウントかメールアドレスでよい）\r\n3. 画面の案内に沿って進める。途中で使い方などを聞かれたら、当てはまるものを選べばよい\r\n4. 料金プランを聞かれたら、**Free（無料）**を選ぶ\r\n\r\n⚠️ パスワードやログイン情報は、Codexに教えなくてかまいません。\r\n\r\n---\r\n\r\n## 2. サイトを公開する（フォルダをドラッグするだけ）\r\n\r\n⚠️ **必ずログインした状態で行う。** ログインせずに上げると、サイトに仮のパスワードがかかって、ほかの人が見られない状態になります。\r\n\r\n1. ログインした状態で、https://app.netlify.com/drop を開く\r\n2. パソコンの `site` フォルダを、**フォルダごと**画面の枠の中にドラッグ＆ドロップする\r\n   - 中身のファイルではなく、`site` フォルダそのものをドラッグする\r\n   - ⚠️ `サイトの設計` フォルダと `素材_元の写真` フォルダは入れない（公開しないもの）\r\n3. 数秒〜数十秒待つと、公開される\r\n4. 表示された **`〇〇.netlify.app`** のアドレスを開いて、サイトが見られるか確認する\r\n\r\nCodexは、公開できたら本人に「スマホでもそのアドレスを開いて、見え方を確認してください」と伝えます。\r\n\r\n---\r\n\r\n## 3. サイトのアドレスを分かりやすい名前にする\r\n\r\n最初は、ランダムな英単語のアドレス（例：`jolly-cat-12345.netlify.app`）になっています。\r\n\r\n1. Netlifyでそのサイトを開く\r\n2. **Project configuration**（プロジェクトの設定。表記が **Site configuration** の場合もある）を開く\r\n3. **General**（全般）の中にある **Change project name**（名前を変える。**Change site name** の場合もある）を押す\r\n4. 半角英数字とハイフンで名前を入れる（例：`yamada-photo`）→ **Save**（保存）\r\n5. アドレスが `yamada-photo.netlify.app` のようになる\r\n\r\n**名前が決まったら、Codexがやること**\r\n- `index.html` などの canonical・OGPのURL、`sitemap.xml`、`robots.txt` のサイトマップのURLを、決まったアドレスに書き換える\r\n- 書き換えたら、下の「6. サイトを更新するとき」の方法で公開し直してもらう（**独自ドメインを付ける予定なら、ドメインを付けてからまとめて書き換える**と、公開し直す回数が1回で済む）\r\n\r\n---\r\n\r\n## 4. 問い合わせフォームを使えるようにする\r\n\r\n### Codexがフォームを作るときの形\r\n\r\n```html\r\n<form name=\"contact\" method=\"POST\" action=\"/thanks.html\" data-netlify=\"true\" netlify-honeypot=\"bot-field\">\r\n  <p hidden>\r\n    <label>この欄は入力しないでください <input name=\"bot-field\"><\/label>\r\n  <\/p>\r\n  <p>\r\n    <label for=\"name\">お名前（必須）<\/label>\r\n    <input id=\"name\" type=\"text\" name=\"name\" required autocomplete=\"name\">\r\n  <\/p>\r\n  <p>\r\n    <label for=\"email\">メールアドレス（必須）<\/label>\r\n    <input id=\"email\" type=\"email\" name=\"email\" required autocomplete=\"email\">\r\n  <\/p>\r\n  <p>\r\n    <label for=\"message\">ご相談の内容（必須）<\/label>\r\n    <textarea id=\"message\" name=\"message\" rows=\"6\" required><\/textarea>\r\n  <\/p>\r\n  <p><a href=\"/privacy.html\">プライバシーポリシー<\/a>をご確認のうえ、送信してください。<\/p>\r\n  <button type=\"submit\">この内容で相談する<\/button>\r\n<\/form>\r\n```\r\n\r\n- `data-netlify=\"true\"`＝Netlifyにフォームを受け取ってもらう印\r\n- `netlify-honeypot=\"bot-field\"`＝**ロボットのいたずら送信を見分ける仕掛け**。人には見えない欄を置き、そこに入力があったらロボットとして捨てる\r\n- Netlifyには、**迷惑な送信を自動で振り分ける機能**（Akismet）が最初から入っている\r\n- それでもいたずら送信が続くときは、フォームの中に `<div data-netlify-recaptcha=\"true\"><\/div>` を足すと、「私はロボットではありません」の確認を付けられる（見た目が変わるので、困ってから足す）\r\n- `action=\"/thanks.html\"`＝送信したあとに表示するページ\r\n\r\n### 本人に操作してもらうこと\r\n\r\n1. Netlifyでそのサイトを開き、左のメニューの **Forms**（フォーム）を開く\r\n2. **Enable form detection**（フォームを見つけて受け付ける）を押す\r\n   - ⚠️ **最初はオフになっています。** オンにしないと、送信しても届きません\r\n3. **もう一度サイトを公開し直す**（下の「6. サイトを更新するとき」の方法）\r\n   - オンにしたあとの公開から、フォームが受け付けられるようになります\r\n4. 公開したサイトのフォームから、**自分で1回テスト送信する**\r\n5. Netlifyの **Forms** の画面に、送った内容が表示されるか確認する\r\n\r\n### 送信があったらメールで知らせてもらう\r\n\r\n1. Netlifyでそのサイトを開き、**Project configuration**（または **Site configuration**）→ **Notifications**（通知）を開く\r\n2. **Form submission notifications**（フォームが送られたときの通知）の **Add notification**（通知を追加）を押す\r\n3. **Email notification**（メールで通知）を選び、受け取りたいメールアドレスを入れて保存する\r\n4. もう一度テスト送信して、**メールが届くか**確認する（届かなければ迷惑メールフォルダも見てもらう）\r\n\r\n---\r\n\r\n## 5. 公開後にCodexが本人と確認すること\r\n\r\n- [ ] パソコンとスマホの両方で、全部のページが見られる\r\n- [ ] フォームから送ると、`thanks.html` が表示され、通知メールが届く\r\n- [ ] SNSにURLを貼ったときに、タイトルと画像が出る（出ないときは `ogp.jpg` とOGPの設定を見直す）\r\n\r\n---\r\n\r\n## 6. サイトを更新するとき\r\n\r\n1. Codexと一緒に、`site` の中身を直す（**直したいことは、まとめて直してから**）\r\n2. Netlifyでそのサイトを開き、**Deploys**（公開の履歴）の画面を開く\r\n3. 画面の中にあるドラッグ＆ドロップの枠に、**直した `site` フォルダごと**ドラッグする\r\n4. 数十秒待って、サイトを開いて確認する\r\n\r\n⚠️ 公開し直すたびに15クレジット使います（冒頭の「無料枠の仕組み」）。\r\n\r\n---\r\n\r\n## 7. もしサイトが表示されなくなったら\r\n\r\n- 「Site not available」のような表示が出ている → **その月の無料枠を使い切った**可能性が高い。翌月になれば戻る。すぐ戻したい場合は有料プランへの変更が必要になる\r\n- 使った量は、Netlifyのチーム（アカウント）の画面にある料金・使用量のページで確認できる\r\n- 今月の残りが少ないときは、公開し直す回数を減らす\r\n\r\n---\r\n\r\n## 8. 独自のアドレス（ドメイン）を付けたい場合\r\n\r\n`domain-onamae.md` に進みます。\r\n"}, {"path": "Codex版/.agents/skills/homepage-pro/references/search-console-ga4.md", "url": null, "text": "# Googleに知らせる（Search Console）と、見た人の数を測る（GA4）\r\n\r\n> Codexは、この順番で**1つずつ**本人に操作してもらいます。1つ終わるごとに「できたら『できました』と送ってください」と伝えて待ちます。\r\n> 画面の表記は変わることがあります。案内と違ったら、**スクリーンショットを貼ってもらって**、画面に合わせて案内し直します。\r\n> （2026年9月時点の情報です）\r\n> **ドメインを付けたあと（またはNetlifyのアドレスで行くと決めたあと）に行います。** 住所が変わると、登録をやり直すことになるためです。\r\n\r\n---\r\n\r\n## 0. 最初に本人に説明すること\r\n\r\n```\r\nサイトは、公開しただけではGoogleの検索にすぐには出てきません。\r\nそこで、2つの無料の道具を設定します。\r\n\r\n1. Search Console（サーチコンソール）\r\n   ＝Googleに「このサイトがあります」と知らせる道具。検索で何回表示されたかも分かります\r\n2. Googleアナリティクス（GA4）\r\n   ＝サイトに何人来たか、どのボタンが押されたかを測る道具\r\n\r\nどちらもGoogleアカウントがあれば使えます。\r\n```\r\n\r\n## 1. 公開し直す回数を1回にまとめる（Netlifyの無料枠を守るため）\r\n\r\nNetlifyは公開し直すたびに無料枠を使います（`publish-netlify.md`）。だから、**次の3つを全部そろえてから、1回だけ公開し直します。**\r\n\r\n1. ドメインを付けたあとのURLの書き換え（`domain-onamae.md` の「4」）\r\n2. Search Consoleの確認用のタグ（下の「2」）\r\n3. GA4の測定用のタグ（下の「3」）\r\n\r\n---\r\n\r\n## 2. Search Console（サーチコンソール）\r\n\r\n### 2-1. サイトを登録する\r\n\r\n1. https://search.google.com/search-console を開き、Googleアカウントでログインする\r\n2. 「プロパティを追加」を押す（初めての人は、最初からこの画面が出る）\r\n3. 2つの入れ方が出るので、**右側の「URLプレフィックス」**に、サイトのアドレスを `https://` から入れる（例：`https://yamada-reform.com/`）→「続行」\r\n   - 左側の「ドメイン」でもよいが、DNSの設定が要るので、ここでは右側を使う\r\n4. 確認方法の一覧から **「HTMLタグ」** を開き、表示された1行（`<meta name=\"google-site-verification\" content=\"……\">`）を**コピーしてCodexに貼ってもらう**\r\n   - ⚠️ このときは、まだ「確認」を押さない。画面は開いたままにしておいてもらう\r\n\r\n### 2-2. Codexがやること\r\n\r\n- もらった1行を、`index.html` の `<head>` の中に入れる\r\n- ここで GA4 のタグ（下の「3」）も一緒に入れてから、本人に公開し直してもらう\r\n\r\n### 2-3. 確認して、サイトマップを送る\r\n\r\n1. 公開し直したら、Search Consoleの画面に戻って **「確認」** を押す →「所有権を確認しました」と出ればOK\r\n2. 左のメニューの **「サイトマップ」** を開き、「新しいサイトマップの追加」に `sitemap.xml` と入れて **「送信」**\r\n   - 状態が「成功しました」になればOK。「取得できませんでした」は、しばらく待つと直ることが多い\r\n3. 画面上の検索窓（URL検査）に、トップページのアドレスを入れて Enter →「**インデックス登録をリクエスト**」を押す\r\n   - 「インデックス登録」＝Googleの検索の名簿に載せてもらうこと\r\n   - ⚠️ 押してもすぐに検索に出るわけではありません。**数日〜数週間かかる**ことがあります。何度も押しても早くはなりません\r\n\r\n### 2-4. 本人に伝えること\r\n\r\n- 1〜2週間後に、Search Consoleの「検索パフォーマンス」を見ると、**どんな言葉で検索されて、何回表示されたか**が分かる\r\n- お店の名前で検索して出てこないときは、まず1〜2週間待つ。それでも出なければ、Codexに相談する\r\n\r\n---\r\n\r\n## 3. Googleアナリティクス（GA4）\r\n\r\n### 3-1. アカウントを作る\r\n\r\n1. https://analytics.google.com/ を開き、Googleアカウントでログインする\r\n2. 「測定を開始」を押す\r\n3. 順番に入力する\r\n   - **アカウント名**：お店・会社の名前\r\n   - **プロパティ名**：サイトの名前（例：「リフォームTOKYO ホームページ」）\r\n   - **レポートのタイムゾーン**：日本／**通貨**：日本円\r\n   - ビジネスの情報・目的：当てはまるものを選ぶ（迷ったら「見込み客の発掘」など）\r\n4. データの収集で **「ウェブ」** を選ぶ\r\n5. サイトのアドレス（`https://` のあと）と、ストリーム名（例：「ホームページ」）を入れて「作成」\r\n6. 表示された **測定ID（`G-` で始まる英数字）** をコピーして、Codexに貼ってもらう\r\n\r\n### 3-2. Codexがやること\r\n\r\n1. 全部のページの `<head>` の中に、GA4のタグを入れる（`G-XXXXXXXXXX` を、もらった測定IDに置き換える）：\r\n\r\n```html\r\n<!-- Google tag (gtag.js) -->\r\n<script async src=\"https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX\"><\/script>\r\n<script>\r\n  window.dataLayer = window.dataLayer || [];\r\n  function gtag(){dataLayer.push(arguments);}\r\n  gt
