<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ファーストビュー図鑑 | RAISECOLOR</title><style>
*{box-sizing:border-box}body{margin:0;background:#fafaf8;color:#26382f;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}header{background:white;border-bottom:1px solid #e5e9e5;padding:23px 5%}header a{color:inherit;text-decoration:none;font-weight:700;font-size:13px}main{max-width:1250px;margin:auto;padding:62px 24px}.eyebrow{font-size:11px;letter-spacing:.22em;color:#839789}h1{font-size:clamp(34px,5vw,64px);margin:15px 0}.lead{color:#728277;line-height:1.9;max-width:760px}.tools{display:flex;gap:12px;flex-wrap:wrap;margin:35px 0 20px}input{font:inherit;flex:1;min-width:190px;border:1px solid #dce5de;border-radius:9px;padding:13px}.count{font-size:12px;color:#839388;margin-bottom:20px}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.card{background:white;border:1px solid #e6eae6;border-radius:14px;overflow:hidden}.hero{height:295px;position:relative;overflow:hidden;padding:24px;display:flex;align-items:center;background:var(--bg);color:var(--fg)}.visual{position:absolute;background:linear-gradient(140deg,#a9bcb0,#4e786b 65%,#294e48);border-radius:4px;overflow:hidden}.visual:before{content:"";position:absolute;inset:10% 22% -30%;background:#d9d3bf;border-radius:55% 55% 0 0;transform:rotate(-10deg)}.copy{z-index:1;position:relative}.copy small{display:block;font-size:10px;letter-spacing:.19em;margin-bottom:12px}.copy strong{display:block;font-size:clamp(22px,2.8vw,39px);line-height:1.35;letter-spacing:-.04em}.copy em{display:block;font:italic 13px Georgia,serif;margin-top:12px}.hero.full{justify-content:center;text-align:center;color:white}.full .visual{inset:0;border-radius:0}.full .visual:after{content:"";position:absolute;inset:0;background:#132d2799}.hero.split .copy{width:48%}.split .visual{right:0;top:0;width:48%;height:100%}.editorial{align-items:flex-start}.editorial .copy strong{font-size:52px;line-height:1}.editorial .visual{bottom:0;left:0;width:100%;height:38%}.minimal{justify-content:center;text-align:center}.minimal .visual{display:none}.minimal .copy{max-width:70%}.arch .visual{right:6%;top:10%;width:42%;height:82%;border-radius:48% 48% 0 0}.arch .copy{width:50%;font-family:Georgia,serif}.asym .visual{right:5%;top:6%;width:37%;height:87%;transform:rotate(7deg)}.asym .copy{align-self:flex-end;margin-bottom:10%}.duo{justify-content:center;text-align:center}.duo .visual{left:0;top:15%;width:24%;height:70%}.duo:after{content:"";position:absolute;right:0;top:15%;width:24%;height:70%;background:linear-gradient(140deg,#d3b9a6,#846c65)}.duo .copy{max-width:48%}.vertical .copy{writing-mode:vertical-rl;height:190px;margin-left:16%}.vertical .visual{right:4%;width:48%;height:85%}.layer .visual{right:10%;top:8%;width:48%;height:80%;box-shadow:18px 18px 0 #ffffff80}.layer .copy{background:#ffffffd9;padding:20px;margin-left:3%}.number .copy strong{font-size:60px}.number .visual{right:0;top:0;width:45%;height:100%}.dark{background:#172c29;color:#fff}.dark .visual{right:0;top:0;width:60%;height:100%;opacity:.6}.soft .visual{right:5%;top:12%;width:42%;height:78%;border-radius:50%}.soft:before{content:"";position:absolute;width:230px;height:230px;border-radius:50%;background:#eacfc7;left:-55px;bottom:-100px}.panorama{align-items:flex-start}.panorama .visual{left:0;right:0;bottom:0;height:54%}.tiny .visual{right:14%;top:28%;width:20%;height:42%}.tiny .copy{max-width:48%}.blocks{background:linear-gradient(90deg,#e8dbca 0 50%,#c2d6cb 50%)}.blocks .visual{right:8%;top:20%;width:36%;height:65%}.cover .visual{inset:0;opacity:.65}.cover .copy{align-self:flex-end;color:white;text-shadow:0 2px 10px #203d3b}.collage .visual{right:4%;top:6%;width:32%;height:55%}.collage:before,.collage:after{content:"";position:absolute;background:#b4c3b4;width:22%;height:36%;right:25%;bottom:4%;transform:rotate(-9deg)}.collage:after{right:2%;bottom:3%;background:#cdb8ac;transform:rotate(8deg)}.collage .copy{max-width:48%}.line .visual{right:5%;top:10%;width:45%;height:80%}.line .copy{border-left:1px solid;padding-left:22px}.meta{padding:19px}.meta small{font-size:11px;color:#819487}.meta h2{font-size:17px;margin:9px 0}.meta p{font-size:12px;color:#78887c}.meta button,.actions button{border:0;border-radius:8px;padding:11px 14px;background:#294535;color:white;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:#13291bbd;align-items:center;justify-content:center;padding:15px;z-index:5}.modal.open{display:flex}.panel{background:white;border-radius:16px;width:min(850px,100%);max-height:92vh;overflow:auto;padding:25px}.panel .hero{height:320px;border-radius:10px}.panel pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f5f1;border-radius:9px;padding:16px;font-size:12px;line-height:1.7}.actions{display:flex;gap:9px;flex-wrap:wrap}.actions .secondary{background:#e8eee9;color:#294535}footer{text-align:center;padding:55px;color:#899a8d;font-size:12px}@media(max-width:850px){.gallery{grid-template-columns:1fr}}@media(max-width:550px){main{padding:40px 15px}.hero{height:260px}.hero .copy strong{font-size:25px}.editorial .copy strong{font-size:37px}.number .copy strong{font-size:43px}.panel{padding:15px}}
</style></head><body><header><a href="index.html">← RAISECOLOR DESIGN LIBRARY</a></header><main><div class="eyebrow">DESIGN ATLAS / CATEGORY 04</div><h1>ファーストビュー図鑑</h1><p class="lead">ホームページの第一印象を決めるファーストビュー。写真・見出し・余白・視線誘導を変えた18種類の構成見本です。写真部分は配置を示す仮ビジュアルで、実際の撮影写真ではありません。</p><div class="tools"><input id="search" placeholder="構成名・印象で検索"></div><div id="count" class="count"></div><div class="gallery" id="gallery"></div></main><div class="modal" id="modal" role="dialog" aria-modal="true"><div class="panel"><h2 id="title"></h2><div id="large"></div><p id="explain"></p><h3>基本HTML・CSS</h3><pre id="code"></pre><h3>Codexへの指示文</h3><pre id="prompt"></pre><div class="actions"><button id="copyCode">コードをコピー</button><button id="copyPrompt">指示文をコピー</button><button class="secondary" id="close">閉じる</button></div></div></div><footer>© RAISECOLOR DESIGN LIBRARY · 04 HERO</footer><script>
const data=[["H-001","写真全面＋中央コピー","没入感","full"],["H-002","左コピー＋右写真","王道・信頼","split"],["H-003","大きな英字＋写真帯","編集的・都会的","editorial"],["H-004","余白たっぷり中央配置","高級・静謐","minimal"],["H-005","アーチ写真＋明朝","優雅・美容","arch"],["H-006","非対称グリッド","クリエイティブ","asym"],["H-007","左右の写真で挟む","ストーリー","duo"],["H-008","縦書き＋和モダン","伝統・品格","vertical"],["H-009","斜めに重なるカード","立体感・動き","layer"],["H-010","大胆な数字・実績","説得力","number"],["H-011","暗い背景＋光の写真","ラグジュアリー","dark"],["H-012","パステル曲線＋人物","親しみ・柔らかさ","soft"],["H-013","横長パノラマ","開放感","panorama"],["H-014","小さな写真と巨大余白","ミニマル","tiny"],["H-015","カラーブロック分割","ポップ・明快","blocks"],["H-016","雑誌の表紙風","ファッション","cover"],["H-017","3枚の写真コラージュ","多彩・活動的","collage"],["H-018","写真と細い縦ライン","繊細・洗練","line"]];const colors=[['#f0e9de','#554c42'],['#e7eee8','#365748'],['#e8edf0','#3d5667'],['#f5e9e5','#94695c']];const gallery=document.getElementById('gallery'),modal=document.getElementById('modal');let active;
function sample(d){const c=colors[(Number(d[0].slice(2))-1)%4];return '<div class="hero '+d[3]+'" style="--bg:'+c[0]+';--fg:'+c[1]+'"><div class="visual"></div><div class="copy"><small>RAISECOLOR / DESIGN</small><strong>あなたらしさを、<br>カタチに。</strong><em>Design for your story.</em></div></div>'}
function render(){let q=document.getElementById('search').value.toLowerCase();let a=data.filter(d=>d.join(' ').toLowerCase().includes(q));document.getElementById('count').textContent=a.length+' / '+data.length+' デザイン';gallery.innerHTML=a.map(d=>'<article class="card">'+sample(d)+'<div class="meta"><small>'+d[0]+'</small><h2>'+d[1]+'</h2><p>'+d[2]+'</p><button data-id="'+d[0]+'">詳細・コードを見る →</button></div></article>').join('');gallery.querySelectorAll('button').forEach(b=>b.onclick=()=>openDetail(b.dataset.id))}
function codeFor(d){const c=colors[(Number(d[0].slice(2))-1)%4];const variants={full:'position:relative;min-height:80vh;text-align:center;display:grid;place-items:center;',split:'display:grid;grid-template-columns:1fr 1fr;align-items:center;',editorial:'display:grid;grid-template-rows:auto 250px;',minimal:'display:grid;place-items:center;text-align:center;min-height:65vh;',arch:'display:grid;grid-template-columns:1fr 1fr;',asym:'display:grid;grid-template-columns:1.2fr .8fr;',duo:'display:grid;grid-template-columns:1fr 2fr 1fr;',vertical:'display:grid;grid-template-columns:1fr 1fr;',layer:'display:grid;grid-template-columns:1fr 1fr;',number:'display:grid;grid-template-columns:1fr 1fr;',dark:'display:grid;grid-template-columns:1fr 1fr;',soft:'display:grid;grid-template-columns:1fr 1fr;',panorama:'display:grid;grid-template-rows:auto 260px;',tiny:'display:grid;grid-template-columns:2fr 1fr;',blocks:'display:grid;grid-template-columns:1fr 1fr;',cover:'position:relative;min-height:80vh;',collage:'display:grid;grid-template-columns:1fr 1fr;',line:'display:grid;grid-template-columns:1fr 1fr;'};return '<section class="hero-'+d[0].toLowerCase()+'">\n  <div class="hero-copy">\n    <small>RAISECOLOR / DESIGN</small>\n    <h1>あなたらしさを、カタチに。</h1>\n    <p>ここにサービスの魅力を伝える一文を入れます。</p>\n  </div>\n  <img src="hero-photo.jpg" alt="サービスのイメージ">\n</section>\n<style>\n.hero-'+d[0].toLowerCase()+' {\n  '+variants[d[3]]+'\n  gap:clamp(20px,4vw,60px);\n  padding:clamp(50px,7vw,100px) 6%;\n  background:'+c[0]+';color:'+c[1]+';\n}\n.hero-'+d[0].toLowerCase()+' img{width:100%;height:100%;max-height:550px;object-fit:cover;}\n.hero-'+d[0].toLowerCase()+' h1{font-size:clamp(30px,4vw,62px);line-height:1.3;}\n@media(max-width:700px){.hero-'+d[0].toLowerCase()+'{display:flex;flex-direction:column;min-height:auto;}}\n</style>\n<!-- 基本構造です。プレビューの重なり・特殊な写真形状などは追加実装してください。 -->'}
function openDetail(id){active=data.find(d=>d[0]===id);document.getElementById('title').textContent=active[0]+'｜'+active[1];document.getElementById('large').innerHTML=sample(active);document.getElementById('explain').textContent='印象：'+active[2]+'。この見本はレイアウトの方向性を示すもので、完成写真や実際のブランド表現は別途調整します。';document.getElementById('code').textContent=codeFor(active);document.getElementById('prompt').textContent='RAISECOLORファーストビュー図鑑 '+active[0]+'「'+active[1]+'」を参考に、'+active[2]+'な第一印象のファーストビューを制作してください。写真と文字の配置、余白、読みやすさ、スマートフォン対応を重視し、見本の特殊な形状・重なりも再現してください。';modal.classList.add('open')}
document.getElementById('search').oninput=render;document.getElementById('close').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};document.onkeydown=e=>{if(e.key==='Escape')modal.classList.remove('open')};document.getElementById('copyCode').onclick=()=>navigator.clipboard.writeText(document.getElementById('code').textContent);document.getElementById('copyPrompt').onclick=()=>navigator.clipboard.writeText(document.getElementById('prompt').textContent);render();
</script></body></html>
