<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>レイアウト図鑑 | RAISECOLOR</title><style>
*{box-sizing:border-box}body{margin:0;background:#fafaf8;color:#26362e;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}header{background:#fff;padding:24px 5%;border-bottom:1px solid #e6e9e5}header a{text-decoration:none;color:#26362e;font-weight:700;font-size:13px}main{max-width:1240px;margin:auto;padding:65px 24px}.eyebrow{font-size:11px;letter-spacing:.2em;color:#809488}h1{font-size:clamp(36px,5vw,65px);margin:12px 0}.lead{max-width:700px;color:#748176;line-height:1.9}.controls{display:flex;gap:10px;margin:36px 0 20px;flex-wrap:wrap}input{padding:13px 15px;border:1px solid #dfe5df;border-radius:8px;font:inherit;flex:1;min-width:180px}.count{font-size:12px;color:#7e8f83;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{background:white;border:1px solid #e7e9e5;border-radius:13px;overflow:hidden}.preview{height:230px;position:relative;overflow:hidden;padding:18px;display:flex;align-items:center;justify-content:center}.scene{width:100%;height:100%;position:relative;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:9px}.copy{z-index:2;display:flex;flex-direction:column;gap:9px}.copy small{font-size:9px;letter-spacing:.15em;opacity:.65}.copy strong{font-size:clamp(15px,1.7vw,24px);line-height:1.35}.copy i{width:35px;height:2px;background:currentColor;opacity:.45}.photo{background:linear-gradient(145deg,#a6b8aa,#55756a);border-radius:3px;height:75%;min-height:60px;position:relative;overflow:hidden}.photo:after{content:"";position:absolute;left:18%;top:13%;width:60%;height:95%;border-radius:50% 50% 0 0;background:#d8d6c4;transform:rotate(-15deg);opacity:.65}.scene.right{grid-template-columns:1fr 1.25fr}.scene.right .photo{height:100%}.scene.full{display:flex;align-items:end}.scene.full .photo{position:absolute;inset:-18px;width:calc(100% + 36px);height:calc(100% + 36px);background:linear-gradient(140deg,#4d7469,#203e3b)}.scene.full .copy{color:white;padding:15px}.scene.center{display:flex;justify-content:center;text-align:center}.scene.center .photo{display:none}.scene.center .copy{max-width:70%}.scene.stagger .copy{align-self:start;margin-top:12px}.scene.stagger .photo{align-self:end;height:65%}.scene.overlap .photo{width:100%;height:80%;transform:translateX(-20px)}.scene.overlap .copy{background:#ffffffd9;padding:13px;margin-right:-45px}.scene.vertical .copy{writing-mode:vertical-rl;justify-self:center;max-height:155px}.scene.vertical .photo{height:75%}.scene.columns{grid-template-columns:repeat(3,1fr)}.scene.columns .copy{grid-column:1}.scene.columns .photo{grid-column:2/4}.scene.stat .copy strong{font-size:38px}.scene.sidebar{grid-template-columns:25px 1fr 1fr}.scene.sidebar:before{content:"DESIGN";writing-mode:vertical-rl;font-size:10px;letter-spacing:.2em;border-right:1px solid;padding-right:7px}.scene.circle .photo{border-radius:50%;height:auto;aspect-ratio:1}.scene.alternate .photo{transform:translateY(20px)}.scene.mosaic{grid-template-columns:1fr 1fr}.scene.mosaic .photo{height:55%;transform:rotate(-7deg)}.scene.minimal{grid-template-columns:1.5fr .65fr}.scene.minimal .photo{height:40%}.scene.band:before{content:"";position:absolute;background:#b8c9bc;width:calc(100% + 36px);height:45%;left:-18px;bottom:0}.scene.band .photo{height:85%;z-index:1}.scene.steps{grid-template-columns:1fr 1fr}.scene.steps .photo{background:repeating-linear-gradient(0deg,#b9c9d2 0 3px,transparent 3px 35px)}.scene.rail .photo{box-shadow:22px 0 0 #b0b9aa,44px 0 0 #d2c8b9;width:55%}.scene.asym{grid-template-columns:.7fr 1.3fr}.scene.asym .copy{align-self:end;margin-bottom:14px}.scene.asym .photo{height:100%}.meta{padding:18px}.meta small{color:#809488;font-size:11px}.meta h2{font-size:16px;margin:8px 0}.meta p{font-size:12px;color:#78867a}.meta button,.buttons button{border:0;border-radius:8px;background:#263f32;color:white;padding:11px 14px;cursor:pointer}.modal{position:fixed;inset:0;background:#13271bba;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal.show{display:flex}.panel{width:min(780px,100%);max-height:92vh;overflow:auto;background:white;border-radius:16px;padding:25px}.panel .preview{height:260px;border-radius:10px}.panel p{color:#66796b;line-height:1.8}.panel pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f5f1;border-radius:9px;padding:16px;font-size:12px;line-height:1.6}.buttons{display:flex;gap:10px;flex-wrap:wrap}.buttons .secondary{background:#e8eee9;color:#263f32}footer{text-align:center;color:#8b9c8f;font-size:12px;padding:60px}@media(max-width:960px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){main{padding:40px 15px}.grid{grid-template-columns:1fr}.preview{height:250px}.panel{padding:16px}}
</style></head><body><header><a href="index.html">← RAISECOLOR DESIGN LIBRARY</a></header><main><div class="eyebrow">DESIGN ATLAS / CATEGORY 02</div><h1>レイアウト図鑑</h1><p class="lead">写真と文字の配置、余白、重なり、情報の強弱。色を変えただけではない18種類の構成を見比べて、ホームページの設計に活かせます。見本の写真部分は仮のプレースホルダーです。</p><div class="controls"><input id="search" placeholder="レイアウト名・印象で検索"></div><div id="count" class="count"></div><div class="grid" id="grid"></div></main><div class="modal" id="modal" role="dialog" aria-modal="true"><div class="panel"><h2 id="name"></h2><div id="large"></div><p id="desc"></p><h3>HTML・CSS 実装例</h3><pre id="code"></pre><h3>Codexへの指示文</h3><pre id="prompt"></pre><div class="buttons"><button id="copyCode">コードをコピー</button><button id="copyPrompt">指示文をコピー</button><button class="secondary" id="close">閉じる</button></div></div></div><footer>© RAISECOLOR DESIGN LIBRARY · 02 LAYOUT</footer><script>
const data=[["L-001","左右二分割","王道・読みやすい","split","#e7e8df","#33483c"],["L-002","写真を大きく右寄せ","上品・余韻","right","#eee6df","#5e4e43"],["L-003","大胆な全面ビジュアル","没入感・インパクト","full","#293b38","#f6f3e8"],["L-004","中央の小さな余白","静けさ・高級感","center","#f5f1e9","#61584d"],["L-005","斜めの段差構成","動き・個性","stagger","#e9edf0","#395668"],["L-006","重なる写真カード","雑誌的・立体感","overlap","#efe7df","#795c50"],["L-007","縦書きと横長写真","和モダン","vertical","#e5ebe3","#435a43"],["L-008","3カラムの編集レイアウト","情報豊富・整然","columns","#e8edf0","#435a6b"],["L-009","巨大な数字と説明","実績・信頼","stat","#e7eee8","#345d4b"],["L-010","細いサイドバー付き","洗練・編集的","sidebar","#f0ede7","#6c5c4c"],["L-011","写真を切り抜く円形","やわらかい・親しみ","circle","#f9eee9","#9b695a"],["L-012","カードを交互に並べる","ストーリー・流れ","alternate","#e9ece6","#4c624c"],["L-013","グリッドを崩す","創造的・アート","mosaic","#ece8e6","#65575e"],["L-014","大きな余白と小さな写真","静謐・ラグジュアリー","minimal","#f5f1eb","#675e54"],["L-015","背景帯をまたぐ写真","奥行き・立体感","band","#e5e9e7","#4a665d"],["L-016","番号付きプロセス","順序・安心","steps","#e9edf3","#41596e"],["L-017","横スクロール風カード","軽快・発見","rail","#f5eee4","#84634c"],["L-018","余白のある非対称構図","現代的・大胆","asym","#e9e9e3","#3e5147"]],grid=document.getElementById('grid'),modal=document.getElementById('modal');let active;
function sample(d){return '<div class="preview" style="background:'+d[4]+';color:'+d[5]+'"><div class="scene '+d[3]+'"><div class="copy"><small>RAISECOLOR / DESIGN</small><strong>想いを、<br>カタチに。</strong><i></i></div><div class="photo" aria-label="写真の配置見本"></div></div></div>'}
function render(){let q=document.getElementById('search').value.toLowerCase();let f=data.filter(d=>d.join(' ').toLowerCase().includes(q));document.getElementById('count').textContent=f.length+' / '+data.length+' レイアウト';grid.innerHTML=f.map(d=>'<article class="card">'+sample(d)+'<div class="meta"><small>'+d[0]+'</small><h2>'+d[1]+'</h2><p>'+d[2]+'</p><button data-id="'+d[0]+'">構成・コードを見る →</button></div></article>').join('');grid.querySelectorAll('button').forEach(b=>b.onclick=()=>openDetail(b.dataset.id))}
function codeFor(d){let css={split:'grid-template-columns:1fr 1fr;',right:'grid-template-columns:1fr 1.25fr;',full:'grid-template-columns:1fr; min-height:70vh;',center:'grid-template-columns:1fr;text-align:center;',stagger:'grid-template-columns:1fr 1fr;align-items:end;',overlap:'grid-template-columns:1fr 1fr;',vertical:'grid-template-columns:1fr 2fr;',columns:'grid-template-columns:repeat(3,1fr);',stat:'grid-template-columns:1fr 1fr;',sidebar:'grid-template-columns:80px 1fr 1fr;',circle:'grid-template-columns:1fr 1fr;',alternate:'grid-template-columns:1fr 1fr;',mosaic:'grid-template-columns:1fr 1fr;',minimal:'grid-template-columns:1.5fr .65fr;',band:'grid-template-columns:1fr 1fr;',steps:'grid-template-columns:1fr 1fr;',rail:'grid-template-columns:1fr 1fr;',asym:'grid-template-columns:.7fr 1.3fr;'};return '<section class="layout-'+d[0].toLowerCase()+'">\n  <div class="layout-copy">\n    <small>RAISECOLOR / DESIGN</small>\n    <h2>想いを、カタチに。</h2>\n    <p>ここに紹介文を入れます。</p>\n  </div>\n  <img src="your-photo.jpg" alt="サービスのイメージ写真">\n</section>\n<style>\n.layout-'+d[0].toLowerCase()+' {\n  display:grid;\n  '+css[d[3]]+'\n  gap:clamp(24px,5vw,72px);\n  align-items:center;\n  padding:clamp(40px,7vw,100px) 6%;\n  background:'+d[4]+';\n  color:'+d[5]+';\n}\n.layout-'+d[0].toLowerCase()+' img {width:100%;height:100%;max-height:520px;object-fit:cover;}\n@media(max-width:700px){.layout-'+d[0].toLowerCase()+'{grid-template-columns:1fr;}}\n</style>\n<!-- これはレイアウトの基本構造です。プレビューの重なりや特殊な装飾は追加調整が必要です。 -->'}
function openDetail(id){active=data.find(d=>d[0]===id);document.getElementById('name').textContent=active[0]+'｜'+active[1];document.getElementById('large').innerHTML=sample(active);document.getElementById('desc').textContent='印象：'+active[2]+'。この構成は、文字と写真の優先順位を設計するための見本です。写真素材は別途差し替えてください。';document.getElementById('code').textContent=codeFor(active);document.getElementById('prompt').textContent='RAISECOLORレイアウト図鑑 '+active[0]+'「'+active[1]+'」を参考に、'+active[2]+'の印象を持つWebセクションを制作してください。写真と文字の配置、余白、視線誘導を再現し、スマートフォンでは自然な縦並びにしてください。図鑑のHTML・CSSを土台に、固有の装飾も必要に応じて実装してください。';modal.classList.add('show')}
document.getElementById('search').oninput=render;document.getElementById('close').onclick=()=>modal.classList.remove('show');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};document.onkeydown=e=>{if(e.key==='Escape')modal.classList.remove('show')};document.getElementById('copyCode').onclick=()=>navigator.clipboard.writeText(document.getElementById('code').textContent);document.getElementById('copyPrompt').onclick=()=>navigator.clipboard.writeText(document.getElementById('prompt').textContent);render();
</script></body></html>
