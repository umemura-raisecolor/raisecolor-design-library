<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>あしらい図鑑 | RAISECOLOR</title><style>
*{box-sizing:border-box}body{margin:0;background:#fafaf8;color:#26372f;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}header{padding:24px 5%;background:white;border-bottom:1px solid #e6eae6}header a{color:inherit;text-decoration:none;font-size:13px;font-weight:700}main{max-width:1250px;margin:auto;padding:65px 25px}.kicker{font-size:11px;letter-spacing:.22em;color:#8b9c8e}h1{font-size:clamp(38px,5vw,65px);letter-spacing:-.05em;margin:12px 0}p{line-height:1.85;color:#728177}.lead{max-width:750px}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:35px 0 20px}input,select{font:inherit;border:1px solid #dce5dd;border-radius:9px;background:#fff;padding:13px 15px}input{flex:1;min-width:190px}.count{font-size:12px;color:#819287;margin:0 0 18px}.grid-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:23px}.card{border:1px solid #e7eae5;border-radius:13px;overflow:hidden;background:white}.art{height:230px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:35px;background:var(--bg);color:var(--fg)}.sample{position:relative;z-index:1;text-align:center;font-family:Georgia,"Yu Mincho",serif;max-width:100%;font-size:22px;line-height:1.5}.sample small{display:block;font-family:Arial,sans-serif;letter-spacing:.2em;font-size:9px;margin-bottom:10px}.art:before,.art:after{pointer-events:none}.line .sample:after{content:"";display:block;height:1px;width:95px;background:currentColor;margin:16px auto}.double .sample{border-top:3px double;border-bottom:3px double;padding:18px}.vertical .sample{border-left:2px solid;padding-left:20px;text-align:left}.short .sample:before{content:"";display:block;width:35px;height:3px;background:currentColor;margin:0 auto 20px}.pill .sample{border:1px solid;border-radius:99px;padding:15px 24px}.rounded .sample{border:1px solid #b4c9b7;border-radius:20px;background:#ffffffa8;padding:25px}.corners .sample{padding:25px;border:1px solid transparent;border-image:linear-gradient(135deg,currentColor 15%,transparent 15%,transparent 85%,currentColor 85%) 1}.dashed .sample{border:2px dashed;padding:24px}.marker .sample{background:linear-gradient(transparent 57%,#e5d8a1 57%);padding:0 4px}.circle:before{content:"";width:190px;height:190px;background:#d9e4d5;border-radius:50%;position:absolute}.offset .sample{background:#fff;padding:24px;box-shadow:15px 15px 0 #bdcfc2}.gradient{background:linear-gradient(120deg,#f4e4df,#e3eee7,#e5e8f1)}.diagonal:before{content:"";position:absolute;width:180%;height:80px;background:#d5e2d7;transform:rotate(-20deg)}.grid{background-image:linear-gradient(#a6b9a833 1px,transparent 1px),linear-gradient(90deg,#a6b9a833 1px,transparent 1px);background-size:24px 24px}.dots{background-image:radial-gradient(#9cb5a2 1.5px,transparent 2px);background-size:18px 18px}.dots .sample{background:var(--bg);padding:15px}.sparkle .sample:before,.sparkle .sample:after{content:"✳";font-size:28px;position:absolute;top:-28px;left:-27px}.sparkle .sample:after{left:auto;right:-24px;top:auto;bottom:-35px}.quote .sample:before{content:"“";font-size:70px;display:block;height:40px;line-height:1}.watermark:before{content:"01";font:900 180px Arial;opacity:.09;position:absolute}.photo .sample,.photoCircle .sample,.arch .sample{background:linear-gradient(130deg,#b3c6b6,#547d69);color:white;padding:50px 25px;box-shadow:0 0 0 8px #ffffff80}.photoCircle .sample{border-radius:50%;aspect-ratio:1;display:flex;flex-direction:column;justify-content:center}.arch .sample{border-radius:100px 100px 0 0}.wave:before{content:"";position:absolute;bottom:-35px;width:130%;height:105px;border-radius:50% 50% 0 0;background:#c7d9cc}.stitch .sample{border:2px dashed #b68f7b;padding:24px;border-radius:12px}.shadow .sample{background:white;border-radius:12px;padding:25px;box-shadow:0 25px 35px #315b3b38}.sides .sample:before,.sides .sample:after{content:"";width:35px;height:1px;background:currentColor;position:absolute;top:50%;left:-50px}.sides .sample:after{left:auto;right:-50px}.brackets .sample:before{content:"[";font-size:60px;position:absolute;left:-35px;top:-20px}.brackets .sample:after{content:"]";font-size:60px;position:absolute;right:-35px;top:-20px}.orbital:before{content:"";position:absolute;width:150px;height:150px;border:1px solid;border-radius:50%;opacity:.4}.orbital:after{content:"";position:absolute;width:100%;height:1px;background:currentColor;opacity:.3}.badge .sample:before{content:"01";display:block;background:#4d7965;color:white;font:700 13px Arial;width:37px;height:37px;line-height:37px;border-radius:50%;margin:0 auto 15px}.ribbon .sample{background:#b0cdb9;padding:16px 26px;clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%)}.blur:before{content:"";width:150px;height:150px;background:#b8d2e2;border-radius:50%;filter:blur(45px);position:absolute;left:12%;top:5%}.blur:after{content:"";width:150px;height:150px;background:#e8bdc6;border-radius:50%;filter:blur(45px);position:absolute;right:12%;bottom:5%}.meta{padding:19px}.meta small{color:#8a9b8e;font-size:11px}.meta h2{font-size:16px;margin:8px 0}.meta p{font-size:12px;margin:0 0 16px}.meta button,.actions button{background:#294535;color:#fff;border:0;border-radius:8px;padding:11px 14px;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:#12271bba;z-index:10;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.panel{background:#fff;width:min(790px,100%);max-height:92vh;overflow:auto;border-radius:16px;padding:25px}.panel .art{height:245px;border-radius:10px}.panel pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f5f1;padding:16px;border-radius:9px;line-height:1.6;font-size:12px}.actions{display:flex;gap:9px;flex-wrap:wrap}.actions .secondary{background:#e9eee9;color:#294535}footer{text-align:center;padding:60px;color:#8a9a8f;font-size:12px}@media(max-width:970px){.grid-list{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){main{padding:40px 15px}.grid-list{grid-template-columns:1fr}.panel{padding:17px}}
/* Japanese line-breaking quality rules */ .sample b,.sample,.copy strong,.mockbody h2,.preview h3,.tile b,.art .sample{overflow-wrap:normal;word-break:keep-all} .jp-phrase{display:inline-block;white-space:nowrap;max-width:100%} @media(max-width:600px){.preview .sample b,.preview .copy strong,.mockbody h2,.preview h3{font-size:clamp(16px,4vw,25px)} .tile b{font-size:clamp(10px,2.8vw,13px)}}</style></head><body><header><a href="index.html">← RAISECOLOR DESIGN LIBRARY</a></header><main><div class="kicker">DESIGN ATLAS / CATEGORY 03</div><h1>あしらい図鑑</h1><p class="lead">線、枠、背景、図形、装飾、写真の見せ方。30種類の違いを実際の見本で比較できます。装飾は主役ではなく、文字や写真を引き立てるためのもの。使いすぎないことも大切です。</p><div class="controls"><input id="search" placeholder="名前・印象で検索"><select id="category"><option value="">すべてのカテゴリー</option><option value="線">線</option><option value="枠">枠</option><option value="背景">背景</option><option value="写真">写真</option><option value="装飾">装飾</option></select></div><div id="count" class="count"></div><div id="list" class="grid-list"></div></main><div class="modal" id="modal" role="dialog" aria-modal="true"><div class="panel"><h2 id="name"></h2><div id="large"></div><p id="desc"></p><h3>HTML・CSS実装コード</h3><pre id="code"></pre><h3>Codexへの指示文</h3><pre id="prompt"></pre><div class="actions"><button id="copyCode">コードをコピー</button><button id="copyPrompt">指示文をコピー</button><button class="secondary" id="close">閉じる</button></div></div></div><footer>© RAISECOLOR DESIGN LIBRARY · 03 DECORATION</footer><script>
const data=[["D-001","極細ライン","上品・静けさ","line"],["D-002","二重罫線","クラシック・品格","double"],["D-003","縦ライン","端正・編集的","vertical"],["D-004","短いアクセント線","ミニマル","short"],["D-005","丸いラベル","やさしい・親しみ","pill"],["D-006","角丸の囲み","安心感・整理","rounded"],["D-007","コーナー装飾","高級・繊細","corners"],["D-008","切手風の点線枠","遊び心・手作り感","dashed"],["D-009","淡いマーカー","明るい・親切","marker"],["D-010","丸い背景図形","ナチュラル","circle"],["D-011","ずらした背景","奥行き・雑誌風","offset"],["D-012","柔らかなグラデーション","透明感・美容","gradient"],["D-013","斜めの背景帯","動き・現代的","diagonal"],["D-014","格子のパターン","知的・整然","grid"],["D-015","小さなドット","軽やか・かわいい","dots"],["D-016","星形アクセント","遊び心・印象的","sparkle"],["D-017","引用符の装飾","ストーリー・信頼","quote"],["D-018","番号の透かし","実績・洗練","watermark"],["D-019","写真のフレーム","上品・フォトジェニック","photo"],["D-020","円形の写真窓","やわらかい・美容","photoCircle"],["D-021","アーチ型の窓","エレガント・建築的","arch"],["D-022","波型の区切り","やさしい・自然","wave"],["D-023","ステッチライン","温かい・クラフト","stitch"],["D-024","浮遊するカード","軽やか・モダン","shadow"],["D-025","左右の飾り線","クラシカル","sides"],["D-026","大きな括弧","知的・個性的","brackets"],["D-027","丸と直線の組合せ","端正・現代的","orbital"],["D-028","ナンバーバッジ","順序・見やすさ","badge"],["D-029","リボン見出し","親しみ・華やか","ribbon"],["D-030","背景のぼかし","透明感・幻想的","blur"]],list=document.getElementById('list'),modal=document.getElementById('modal');let active;
const categories={line:'線',double:'線',vertical:'線',short:'線',pill:'枠',rounded:'枠',corners:'枠',dashed:'枠',marker:'装飾',circle:'背景',offset:'背景',gradient:'背景',diagonal:'背景',grid:'背景',dots:'背景',sparkle:'装飾',quote:'装飾',watermark:'背景',photo:'写真',photoCircle:'写真',arch:'写真',wave:'背景',stitch:'枠',shadow:'枠',sides:'線',brackets:'装飾',orbital:'装飾',badge:'装飾',ribbon:'装飾',blur:'背景'};
const palettes=[['#f3efe7','#5f5548'],['#e8f0eb','#345d4b'],['#f6e9e5','#96695f'],['#e9edf1','#445e70']];
function art(d){let p=palettes[(Number(d[0].slice(2))-1)%4];return '<div class="art '+d[3]+'" style="--bg:'+p[0]+';--fg:'+p[1]+'"><div class="sample"><small>RAISECOLOR / DESIGN</small>想いを、 カタチに。</div></div>'}
function render(){let q=document.getElementById('search').value.toLowerCase(),c=document.getElementById('category').value;let filtered=data.filter(d=>d.join(' ').toLowerCase().includes(q)&&(!c||categories[d[3]]===c));document.getElementById('count').textContent=filtered.length+' / '+data.length+' デザイン';list.innerHTML=filtered.map(d=>'<article class="card">'+art(d)+'<div class="meta"><small>'+d[0]+' / '+categories[d[3]]+'</small><h2>'+d[1]+'</h2><p>'+d[2]+'</p><button data-id="'+d[0]+'">詳細・コードを見る →</button></div></article>').join('');list.querySelectorAll('button').forEach(b=>b.onclick=()=>openDetail(b.dataset.id))}
function codeFor(d){let p=palettes[(Number(d[0].slice(2))-1)%4];return '<div class="decoration-'+d[0].toLowerCase()+'">\n  <span>RAISECOLOR / DESIGN</span>\n  <h2>想いを、 カタチに。</h2>\n</div>\n<style>\n.decoration-'+d[0].toLowerCase()+' {\n  --bg:'+p[0]+';\n  --fg:'+p[1]+';\n  background:var(--bg);\n  color:var(--fg);\n  padding:60px 24px;\n  text-align:center;\n}\n.decoration-'+d[0].toLowerCase()+' h2 {font-size:clamp(24px,3vw,40px);}\n/* 以下の装飾ルールを追加 */\n'+cssFor(d[3])+'\n</style>'}
function cssFor(k){const m={line:'h2:after{content:"";display:block;width:95px;height:1px;background:currentColor;margin:18px auto}',double:'h2{border-top:3px double;border-bottom:3px double;padding:18px}',vertical:'h2{border-left:3px solid;padding-left:20px;text-align:left}',short:'h2:before{content:"";display:block;width:35px;height:3px;background:currentColor;margin:0 auto 20px}',pill:'h2{display:inline-block;border:1px solid;border-radius:99px;padding:15px 24px}',rounded:'h2{border:1px solid #b4c9b7;border-radius:20px;padding:25px}',corners:'h2{border:1px solid; padding:25px;clip-path:polygon(0 0,85% 0,100% 15%,100% 100%,15% 100%,0 85%)}',dashed:'h2{border:2px dashed;padding:24px}',marker:'h2{display:inline;background:linear-gradient(transparent 57%,#e5d8a1 57%)}',circle:'h2{background:#d9e4d5;border-radius:50%;width:220px;height:220px;display:grid;place-items:center;margin:auto}',offset:'h2{background:#fff;padding:24px;box-shadow:15px 15px 0 #bdcfc2}',gradient:'&{background:linear-gradient(120deg,#f4e4df,#e3eee7,#e5e8f1)}',diagonal:'&{background:linear-gradient(160deg,var(--bg) 40%,#d5e2d7 40% 65%,var(--bg) 65%)}',grid:'&{background-image:linear-gradient(#a6b9a833 1px,transparent 1px),linear-gradient(90deg,#a6b9a833 1px,transparent 1px);background-size:24px 24px}',dots:'&{background-image:radial-gradient(#9cb5a2 1.5px,transparent 2px);background-size:18px 18px}',sparkle:'h2:before{content:"✳";margin-right:16px}h2:after{content:"✳";margin-left:16px}',quote:'h2:before{content:"“";display:block;font-size:70px;line-height:.8}',watermark:'&{position:relative}h2:before{content:"01";font-size:100px;opacity:.1;position:absolute;left:30%}',photo:'h2{padding:70px 25px;color:white;background:linear-gradient(130deg,#b3c6b6,#547d69);box-shadow:0 0 0 8px #ffffff80}',photoCircle:'h2{border-radius:50%;width:220px;height:220px;display:grid;place-items:center;margin:auto;background:#547d69;color:white}',arch:'h2{border-radius:100px 100px 0 0;padding:80px 25px 35px;background:#547d69;color:white}',wave:'&{border-radius:0 0 50% 15%}',stitch:'h2{border:2px dashed #b68f7b;padding:24px;border-radius:12px}',shadow:'h2{background:white;border-radius:12px;padding:25px;box-shadow:0 25px 35px #315b3b38}',sides:'h2:before,h2:after{content:"—";margin:0 15px}',brackets:'h2:before{content:"[ ";}h2:after{content:" ]"}',orbital:'h2{border:1px solid;border-radius:50%;width:220px;height:220px;display:grid;place-items:center;margin:auto}',badge:'h2:before{content:"01";display:block;background:#4d7965;color:white;width:40px;height:40px;line-height:40px;border-radius:50%;margin:0 auto 15px;font-size:14px}',ribbon:'h2{background:#b0cdb9;padding:16px 26px;clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%)}',blur:'&{background:radial-gradient(circle at 20% 25%,#b8d2e2,transparent 50%),radial-gradient(circle at 85% 80%,#e8bdc6,transparent 50%),var(--bg)}'};return(m[k]||'').replaceAll('&','.decoration-wrapper')}
function openDetail(id){let d=data.find(x=>x[0]===id);active=d;document.getElementById('name').textContent=d[0]+'｜'+d[1];document.getElementById('large').innerHTML=art(d);document.getElementById('desc').textContent='カテゴリー：'+categories[d[3]]+'。印象：'+d[2]+'。装飾を複数重ねすぎず、見出しの読みやすさと余白を優先してください。';document.getElementById('code').textContent=codeFor(d);document.getElementById('prompt').textContent='RAISECOLORあしらい図鑑 '+d[0]+'「'+d[1]+'」を使い、'+d[2]+'な印象のWebセクションを制作してください。見本の装飾と余白を参考に、レスポンシブ対応と読みやすさを確保してください。';modal.classList.add('open')}
document.getElementById('search').oninput=render;document.getElementById('category').onchange=render;document.getElementById('close').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};document.onkeydown=e=>{if(e.key==='Escape')modal.classList.remove('open')};document.getElementById('copyCode').onclick=()=>navigator.clipboard.writeText(document.getElementById('code').textContent);document.getElementById('copyPrompt').onclick=()=>navigator.clipboard.writeText(document.getElementById('prompt').textContent);render();
</script></body></html>
